<!DOCTYPE html>

  #msg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
         color:#cfe3ff; font:14px -apple-system,sans-serif; text-align:center;

         border:1px solid rgba(150,190,255,.25); z-index:5; }

<body>

<!-- tasks-vision 1.0.1: bản IIFE, chạy bằng thẻ script thường, phơi global `Vision` -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.js"></script>
<script>
const video = document.getElementById('video');
const glc   = document.getElementById('gl');
const view  = document.getElementById('view');
const ctx   = view.getContext('2d');
const msg   = document.getElementById('msg');
const say   = t => { msg.textContent = t; msg.style.display = t ? '' : 'none'; };

const DPR = Math.min(devicePixelRatio, 1.25);
let W = 0, H = 0, VW = 0, VH = 0;
function resize() {
  W = view.width  = Math.round(innerWidth  * DPR);
  H = view.height = Math.round(innerHeight * DPR);
}
addEventListener('resize', resize); resize();

// ===================== Thế giới =====================
// Bỏ hẳn "mặc đồ nhân vật" — mask/costume dán rời luôn lệch theo cử động thật (Leon chê).
// Tạm thời: chỉ đổi NỀN + viền sáng bám mép người (lấy trực tiếp từ mask nên không
// bao giờ lệch, vì không phải tài sản dán rời). Đang chờ Leon chốt hướng khác.
const WORLDS = [
  { id:'ember',  bg:'assets/bg_city.jpg', tint:[1.00,0.55,0.30], edge:'255,190,130', spark:'255,205,150' },
  { id:'violet', bg:'assets/bg_void.jpg', tint:[0.62,0.35,0.98], edge:'210,165,255', spark:'215,175,255' },
  { id:'gold',   bg:'assets/bg_void.jpg', tint:[1.00,0.75,0.25], edge:'255,220,160', spark:'255,225,170' },
];
let worldIdx = 0;

// ===================== WebGL: lớp "thế giới bên kia" — pipeline 6 pass =====================
// Vá theo 5 điểm nghiên cứu chỉ ra (feedback trail, domain-warp, palette IQ, dịch
// chuyển theo độ sáng kiểu Rutt-Etra, bloom+CA+vignette+grain). Fresh -> Feedback ->
// Bright-pass -> Blur ngang -> Blur dọc -> Present (present mới thật sự vẽ ra canvas).
const gl = glc.getContext('webgl2', { antialias:false, alpha:false, premultipliedAlpha:false });

const VS = `#version 300 es
in vec2 p; out vec2 v;
void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }

// --- BEAUTY: làm mịn da nhẹ kiểu edge-aware (giữ biên mắt/tóc/viền sắc, chỉ mịn vùng da
// phẳng màu) trên camera THẬT, trước khi dùng cho MỌI nơi hiển thị (trong dải lẫn ngoài
// dải). Là bộ lọc ảnh thuần (input=output cùng hệ toạ độ, KHÔNG tự mirror) — mirror vẫn
// do các pass sau (FRESH, BLIT) tự lo như cũ, tránh lệch hệ toạ độ giữa cam và mask.
const FS_BEAUTY = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uSrc;
uniform vec2 uPixel;
void main(){
  vec3 c0 = texture(uSrc, v).rgb;
  vec3 sum = vec3(0.0); float wsum = 0.0;
  for (int dy=-1; dy<=1; dy++){
    for (int dx=-1; dx<=1; dx++){
      vec2 off = vec2(float(dx), float(dy)) * uPixel * 2.2;
      vec3 c = texture(uSrc, v+off).rgb;
      float d = length(c - c0);
      float w = exp(-d*d / 0.018);          // càng khác màu càng ít đóng góp -> giữ biên
      sum += c * w; wsum += w;
    }
  }
  vec3 smoothed = sum / max(wsum, 1e-4);
  vec3 col = mix(c0, smoothed, 0.55);        // hoà 1 phần với gốc, tránh trông "nhựa"
  col = col * 1.035 + vec3(0.010, 0.004, 0.0);   // sáng nhẹ + ấm nhẹ, tông da hồng hào hơn
  col = clamp((col - 0.5) * 1.03 + 0.5, 0.0, 1.0);
  o = vec4(col, 1.0);
}`;

// --- BLIT: hiện camera đã beauty khi dải ĐÓNG (không qua pipeline 6-pass) — tự mirror y
// hệt FS_FRESH để nhất quán, để Canvas2D luôn lấy nội dung "đã mirror đúng" từ glc.
const FS_BLIT = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uSrc;
void main(){
  o = texture(uSrc, vec2(1.0 - v.x, 1.0 - v.y));
}`;

function compileProgram(fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
function locs(prog, names){ const o={}; for (const n of names) o[n]=gl.getUniformLocation(prog,n); return o; }

// --- Pass 1 "FRESH": người + nền của khung NÀY, chưa có vệt (đưa vào feedback ở pass 2) ---
// Đ2 domain-warp (thay sin thô), Đ3 bảng màu cosine IQ (thay mix thẳng), Đ4 dịch UV theo
// gradient độ sáng (cơ chế thật của Rutt-Etra — độ sáng đẩy LỆCH hình chứ không tô màu đè).
const FS_FRESH = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uCam, uMask, uBg;
uniform vec2  uBgFit;
uniform vec2  uPixel;
uniform vec3  uTint;
uniform float uTime;
uniform float uTurb;      // kênh handSpeed -> độ nhiễu loạn của domain-warp (KHÔNG set thẳng, chỉ nhiễu thêm)

float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3,289.1)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){
  float val=0.0, amp=0.5;
  for (int i=0;i<4;i++){ val += amp*noise(p); p *= 2.02; amp *= 0.5; }
  return val;
}
// domain warp kiểu Inigo Quilez f(p + h(p)) -> hoạ tiết "thở" thay vì tuần hoàn máy móc.
// turb (0..~2, từ kênh handSpeed) CỘNG THÊM vào biên độ nền — tay càng động, hệ càng
// turbulence hơn; đứng yên thì về mức thở nhẹ mặc định, không bao giờ phẳng lì.
vec2 warp(vec2 p, float t, float turb){
  vec2 q = vec2(fbm(p + t*0.05), fbm(p + vec2(5.2,1.3) - t*0.04));
  return p + (0.22 + 0.30*turb)*(q - 0.5);
}
// bảng màu cosine IQ: không bao giờ xám giữa chừng như mix() tuyến tính
vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d){ return a + b*cos(6.28318*(c*t+d)); }

void main(){
  vec2 uv = vec2(1.0 - v.x, 1.0 - v.y);            // soi gương + lật dọc cho khớp video

  // dịch UV theo gradient độ sáng cục bộ — cơ chế Rutt-Etra thật, không phải phủ màu đè
  float cL = luma(texture(uCam, uv).rgb);
  vec2 gradL = vec2(
    luma(texture(uCam, uv+vec2(uPixel.x,0.0)).rgb) - luma(texture(uCam, uv-vec2(uPixel.x,0.0)).rgb),
    luma(texture(uCam, uv+vec2(0.0,uPixel.y)).rgb) - luma(texture(uCam, uv-vec2(0.0,uPixel.y)).rgb));
  vec2 dispUv = uv + gradL * 0.018;
  vec3 cam   = texture(uCam, dispUv).rgb;
  float mask = texture(uMask, dispUv).r;
  float personA = smoothstep(0.35, 0.65, mask);

  // mép người (đo tại uv gốc cho silhouette ổn định) + dòng chảy domain-warp thật
  vec2 px = uPixel * 3.0;
  float mL = texture(uMask, uv - vec2(px.x,0.0)).r, mR = texture(uMask, uv + vec2(px.x,0.0)).r;
  float mT = texture(uMask, uv - vec2(0.0,px.y)).r, mB = texture(uMask, uv + vec2(0.0,px.y)).r;
  float edge = smoothstep(0.20, 0.55, abs(mL-mR) + abs(mT-mB));
  float flow = 0.5 + 0.5*fbm(warp(uv*6.0, uTime, uTurb) + uTime*0.15);

  // --- nền: Ken Burns + xoáy năng lượng bằng domain-warp thật (không sin/cos thô) ---
  float zoom = 1.0 + 0.05*sin(uTime*0.11);
  vec2 pan = vec2(sin(uTime*0.07), cos(uTime*0.05)) * 0.02;
  vec2 buv = (uv - 0.5 + pan) * uBgFit * zoom + 0.5;
  vec3 bg = texture(uBg, vec2(buv.x, 1.0 - buv.y)).rgb;
  bg *= 0.55 + 0.45 * smoothstep(1.0, 0.0, length(uv-0.5));
  bg += uTint * (fbm(warp(uv*3.0, uTime*0.6, uTurb)) - 0.5) * 0.16;

  // --- người: bảng màu cosine IQ theo độ sáng+dòng chảy+thời gian, không mix() thẳng ---
  float t = cL*0.65 + flow*0.25 + uTime*0.015;
  vec3 person = palette(t, uTint*0.18, mix(uTint, vec3(1.0), 0.55)*0.55, vec3(1.0), uTint*0.22);
  person *= 0.86 + 0.14*sin(uv.y*760.0 - uTime*7.0);           // dòng quét ngang kiểu hologram
  person += uTint * edge * flow * 1.4;                         // viền trong rực theo dòng chảy
  person = mix(cam*0.16 + person*0.84, person, 0.85);          // chừa chút bóng thật cho có khối

  vec3 col = mix(bg, person, personA);
  col += uTint * edge * flow * 0.9;                            // hào quang tràn ra ngoài silhouette

  o = vec4(col, 1.0);
}`;

// --- Pass 2 "COMBINE": ping-pong feedback — Đ1, đòn bẩy lớn nhất trong 5 cái ---
// prev*decay TRỪ một sàn nhỏ (không thì mờ dần thành sương xám) rồi max với khung mới.
const FS_COMBINE = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uPrev, uFresh;
uniform float uDecay;
uniform vec2  uDrift;
uniform float uZoom;
uniform float uKick;      // kênh handAccel -> hệ "giật" mạnh hơn khi tay tăng tốc đột ngột
void main(){
  vec2 uv = (v - 0.5) * uZoom + 0.5 + uDrift;
  vec3 prev  = texture(uPrev, uv).rgb;
  vec3 fresh = texture(uFresh, v).rgb;
  vec3 trail = max(prev*uDecay - 0.02, 0.0);
  o = vec4(max(trail, fresh*(1.0 + uKick*0.9)), 1.0);
}`;

// --- Pass 3 "BRIGHT": trích vùng sáng cho bloom (Đ5) ---
const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uScene;
void main(){
  vec3 c = texture(uScene, v).rgb;
  float l = dot(c, vec3(0.299,0.587,0.114));
  o = vec4(c * smoothstep(0.55, 0.9, l), 1.0);
}`;

// --- Pass 4/5 "BLUR": Gaussian 5-tap tách trục, dùng chung cho ngang rồi dọc ---
const FS_BLUR = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uTex;
uniform vec2 uTexel, uDir;
void main(){
  vec3 sum = texture(uTex, v).rgb * 0.2270270270;
  vec2 off1 = uDir * uTexel * 1.3846153846, off2 = uDir * uTexel * 3.2307692308;
  sum += texture(uTex, v+off1).rgb * 0.3162162162; sum += texture(uTex, v-off1).rgb * 0.3162162162;
  sum += texture(uTex, v+off2).rgb * 0.0702702703; sum += texture(uTex, v-off2).rgb * 0.0702702703;
  o = vec4(sum, 1.0);
}`;

// --- Pass 6 "PRESENT": hợp bloom + chromatic aberration + vignette + grain có ngưỡng độ sáng (Đ5) ---
// Pass DUY NHẤT vẽ ra chính canvas glc (framebuffer null) — mấy pass trên đều ra FBO offscreen.
const FS_PRESENT = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uScene, uBloom;
uniform float uTime;
float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3,289.1)))*43758.5453); }
void main(){
  vec2 dir = v - 0.5;
  vec3 col = vec3(
    texture(uScene, v + dir*0.0035).r,
    texture(uScene, v).g,
    texture(uScene, v - dir*0.0035).b);
  col += texture(uBloom, v).rgb * 0.55;
  float vig = smoothstep(0.95, 0.35, length(dir));
  col *= mix(0.62, 1.0, vig);
  float l = dot(col, vec3(0.299,0.587,0.114));
  float g = hash(v*800.0 + uTime) - 0.5;
  col += g * 0.035 * mix(1.0, 0.3, smoothstep(0.05,0.5,l));    // grain có ngưỡng: xám phẳng đọc là filter, gated đọc là film
  o = vec4(col, 1.0);
}`;

const progBeauty  = compileProgram(FS_BEAUTY);
const progBlit    = compileProgram(FS_BLIT);
const progFresh   = compileProgram(FS_FRESH);
const progCombine = compileProgram(FS_COMBINE);
const progBright  = compileProgram(FS_BRIGHT);
const progBlur    = compileProgram(FS_BLUR);
const progPresent = compileProgram(FS_PRESENT);
const uBeauty  = locs(progBeauty,  ['uPixel']);
const uFresh   = locs(progFresh,   ['uBgFit','uPixel','uTint','uTime','uTurb']);
const uCombine = locs(progCombine, ['uDecay','uDrift','uZoom','uKick']);
const uBlur    = locs(progBlur,    ['uTexel','uDir']);
const uPresent = locs(progPresent, ['uTime']);
// sampler unit cố định, gán 1 lần — không đổi theo khung
gl.useProgram(progBeauty);  gl.uniform1i(gl.getUniformLocation(progBeauty,'uSrc'),0);
gl.useProgram(progBlit);    gl.uniform1i(gl.getUniformLocation(progBlit,'uSrc'),0);
gl.useProgram(progFresh);   gl.uniform1i(gl.getUniformLocation(progFresh,'uCam'),0);
                             gl.uniform1i(gl.getUniformLocation(progFresh,'uMask'),1);
                             gl.uniform1i(gl.getUniformLocation(progFresh,'uBg'),2);
gl.useProgram(progCombine); gl.uniform1i(gl.getUniformLocation(progCombine,'uPrev'),0);
                             gl.uniform1i(gl.getUniformLocation(progCombine,'uFresh'),1);
gl.useProgram(progBright);  gl.uniform1i(gl.getUniformLocation(progBright,'uScene'),0);
gl.useProgram(progBlur);    gl.uniform1i(gl.getUniformLocation(progBlur,'uTex'),0);
gl.useProgram(progPresent); gl.uniform1i(gl.getUniformLocation(progPresent,'uScene'),0);
                             gl.uniform1i(gl.getUniformLocation(progPresent,'uBloom'),1);

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
// vị trí attribute 'p' giống nhau ở mọi program (cùng VS) -> lấy từ progFresh, bật 1 lần
const pl = gl.getAttribLocation(progFresh, 'p');
gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);

function mkTex(unit){ const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t; }
const texCam = mkTex(0), texBg = mkTex(2), blank1 = mkTex(1);
gl.activeTexture(gl.TEXTURE1);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));

const imgCache = {};
function pushTex(unit, tex, src){
  gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
}
function loadTex(unit, tex, src, onload){
  if (imgCache[src]) { pushTex(unit, tex, imgCache[src]); onload && onload(imgCache[src]); return; }
  const im = new Image();
  im.onload = () => { imgCache[src] = im; pushTex(unit, tex, im); onload && onload(im); };
  im.onerror = () => console.warn('thiếu asset:', src);
  im.src = src;
}
let bgAspect = 0.667;

// --- FBO cho pipeline: fresh (full-res) + 2 vệt ping-pong (full-res) + 3 FBO bloom (1/4 res) ---
function createFBO(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fb, tex, w, h };
}
function resizeFBO(o, w, h){
  gl.bindTexture(gl.TEXTURE_2D, o.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  o.w = w; o.h = h;
}
let fboFresh=null, trail=[null,null], trailRead=0, bloomBright=null, bloomBlurA=null, bloomBlurB=null, fboBeauty=null;
let pipeW=0, pipeH=0;
function resetTrail(){
  if (!trail[0]) return;
  for (const t of trail) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.viewport(0,0,t.w,t.h);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function ensurePipeline(w, h){
  if (pipeW === w && pipeH === h && fboFresh) return;
  pipeW = w; pipeH = h;
  const bw = Math.max(2, w>>2), bh = Math.max(2, h>>2);
  if (!fboFresh) {
    fboFresh = createFBO(w,h); fboBeauty = createFBO(w,h);
    trail = [createFBO(w,h), createFBO(w,h)];
    bloomBright = createFBO(bw,bh); bloomBlurA = createFBO(bw,bh); bloomBlurB = createFBO(bw,bh);
  } else {
    resizeFBO(fboFresh, w, h); resizeFBO(fboBeauty, w, h); resizeFBO(trail[0], w, h); resizeFBO(trail[1], w, h);
    resizeFBO(bloomBright, bw, bh); resizeFBO(bloomBlurA, bw, bh); resizeFBO(bloomBlurB, bw, bh);
  }
  resetTrail();
}

function applyWorld(){
  const w = WORLDS[worldIdx];
  loadTex(2, texBg, w.bg, im => { bgAspect = im.naturalWidth/im.naturalHeight; });
  resetTrail();   // đổi thế giới -> xoá vệt cũ, khỏi lem màu theme trước sang theme mới
}

// ===================== Mô hình =====================
let hand = null, seg = null, ready = false;
let hands = [], maskTex = null;

// 17MB model mà máy chủ chỉ cho cache 1 giờ -> tự giữ lại, lần sau mở là có ngay
async function modelBuf(url){
  try {
    const c = await caches.open('mp-tasks-v1');
    let r = await c.match(url);
    if (!r) { await c.add(url); r = await c.match(url); }
    if (r) return new Uint8Array(await r.arrayBuffer());
  } catch(e){ /* cache hỏng thì tải thẳng */ }
  return new Uint8Array(await (await fetch(url)).arrayBuffer());
}

async function initModels(){
  const { FilesetResolver } = Vision;
  const fs = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');
  const M = 'https://storage.googleapis.com/mediapipe-models/';  // canvas: glc -> cả ba model dùng CHUNG context của mình, lấy được mask dạng texture
  // Đo trên 60 khung ref: ngưỡng 0.5 -> tỉ lệ bắt đủ 2 tay 0.82; hạ còn 0.25 -> 0.95,
  // không lần nào dương tính giả trên khung trống. Model tay chịu ngưỡng thấp tốt.
  hand = await Vision.HandLandmarker.createFromOptions(fs, { canvas: glc, runningMode:'VIDEO', numHands:2,
    minHandDetectionConfidence:0.25, minHandPresenceConfidence:0.25, minTrackingConfidence:0.25,
    baseOptions:{ delegate:'GPU', modelAssetBuffer: await modelBuf(M+'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task') }});
  // FaceLandmarker đã bỏ cùng mặt nạ — mở lại khi có hướng mới cần khoá mặt (xem git history commit b8b785d)
  seg = await Vision.ImageSegmenter.createFromOptions(fs, { canvas: glc, runningMode:'VIDEO',
    outputConfidenceMasks:true, outputCategoryMask:false,
    baseOptions:{ delegate:'GPU', modelAssetBuffer: await modelBuf(M+'image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite') }});
  ready = true;
}


// ---- One Euro Filter: chuẩn khử rung landmark trong AR ----
function OneEuro(minCut=1.2, beta=0.5, dCut=1.0){
  let xPrev=null, dxPrev=0, tPrev=null;
  const a = (cut, dt) => { const r = 2*Math.PI*cut*dt; return r/(r+1); };
  return (x, t) => {
    if (xPrev === null || !isFinite(xPrev)) { xPrev = x; tPrev = t; return x; }
    const dt = Math.max(1e-3, t - tPrev); tPrev = t;
    const dx = (x - xPrev)/dt;
    dxPrev = dxPrev + a(dCut, dt)*(dx - dxPrev);
    xPrev = xPrev + a(minCut + beta*Math.abs(dxPrev), dt)*(x - xPrev);
    return xPrev;
  };
}

// ===================== Dải =====================
const GRACE = 0.55;
let A=null, B=null, rollA=0, rollB=0, seenA=0, seenB=0;
let rawA=null, rawB=null, velA={x:0,y:0}, velB={x:0,y:0}, lastDetectT=0;   // ngoại suy chuyển động giữa các lần model tay chạy
let ambient=[];   // hạt năng lượng trôi lơ lửng trong dải khi mở, cho nền/viền "sống"
let alive=0, hadHands=false, sparks=[], tSec=0;
// hạ ngưỡng conf tay (0.5->0.25, xem "Bug bắt tay" trong git log) từng đổi để bắt đủ 2 tay
// thật, nhưng cái giá phải trả là model đôi khi tách MỘT tay thật (đặc biệt tư thế xoè vài
// ngón) thành 2 "tay" giả có vị trí đủ xa nhau để qua được ngưỡng mở dải -> dải mở toang dù
// chỉ giơ 1 tay (Leon báo). Model thật KHÔNG có field "độ chắc chắn" lộ ra để lọc trực tiếp,
// nên lọc bằng THỜI GIAN: 1 tay thật khi đưa lên sẽ giữ ổn định hands.length>=2 liên tục
// nhiều khung; hàng giả thường chỉ loé 1-2 khung rồi mất. Đo trên video ref thật: khi 2 tay
// thật xoè ra, chuỗi hands.length>=2 kéo dài liên tục 20-44 khung mỗi lần -> ngưỡng 4 khung
// gần như không thêm độ trễ cảm nhận được cho trường hợp thật, nhưng chặn được phát hiện đôi
// loé 1 khung.
let twoHandStreak = 0;
const TWO_HAND_STREAK_MIN = 4;
// Lớp chặn thứ 2, ĐỘC LẬP với streak — quan trọng hơn: streak chỉ lọc được phát hiện đôi
// LOÉ LÊN rồi mất; nó KHÔNG chặn được trường hợp 2 "tay" ổn định thật sự nhưng không phải là
// cử chỉ dải — ví dụ camera vừa mở rộng góc (FOV fix trước) giờ lỡ thấy luôn bàn tay kia đang
// để yên trên bàn, MediaPipe nhận diện ĐÚNG là 2 tay thật chứ không nhiễu. Thiết kế dải vốn đã
// định nghĩa cử chỉ là "CHỤM SÁT rồi KÉO RA" (xem ghi chú cũ "chụm sát = chưa có gì") -> bắt
// buộc 2 tay phải từng ở gần nhau (< 8% bề rộng màn hình) tại một thời điểm SAU khi đã bind,
// mới cho phép gate mở dần theo khoảng cách. 1 tay đưa lên + 1 tay để yên chỗ khác thì 2 điểm
// đó không bao giờ gần nhau -> pairEverClose không bao giờ true -> dải không mở được dù giữ bao lâu.
let pairEverClose = false;
let fA = { x:OneEuro(2.2,0.9,1.0), y:OneEuro(2.2,0.9,1.0) }, fB = { x:OneEuro(2.2,0.9,1.0), y:OneEuro(2.2,0.9,1.0) };
const lerpA = (a,b,t) => a + (b-a)*t;

// ===================== Kênh (channel, kiểu CHOP của TouchDesigner) =====================
// Mọi tín hiệu sống đi qua đây thành "kênh" độc lập có tên, thay vì gắn cứng
// 1 landmark -> 1 hiệu ứng. Hiệu ứng mới chỉ cần ĐỌC kênh có sẵn; đổi nguồn (sau này
// nối audio chẳng hạn) chỉ cần đổi chỗ GHI kênh, chỗ đọc không đụng gì.
const CH = {
  time: 0,
  ribbonOpen: 0,     // = alive, 0..1
  ribbonLen: 0,      // độ dài dải hiện tại (px), 0 khi đóng
  handSpeed: 0,      // tốc độ tay đã lọc mượt, vô đơn vị (chuẩn hoá theo bề rộng màn hình)
  handAccel: 0,      // độ giật tăng tốc tức thời — chỉ dương, dùng cho hiệu ứng "kick"
  pinchOpen: 1,       // độ nhúm cái-trỏ TRUNG BÌNH 2 tay, đã lọc mượt — 1 = mức trung tính
};
const chLag = { handSpeed: OneEuro(0.8, 0.9, 1.0), pinch: OneEuro(1.5, 0.6, 1.0) };   // lọc riêng từng kênh, tách khỏi lọc vị trí của fA/fB
let chPrevMid = null, chPrevSpeed = 0;
function updateChannels(dt){
  CH.time = tSec;
  CH.ribbonOpen = alive;
  if (A && B) {
    CH.ribbonLen = Math.hypot(B.x-A.x, B.y-A.y);
    const mid = { x:(A.x+B.x)/2, y:(A.y+B.y)/2 };
    const raw = chPrevMid ? Math.hypot(mid.x-chPrevMid.x, mid.y-chPrevMid.y)/Math.max(dt,1e-3)/Math.max(W,1) : 0;
    chPrevMid = mid;
    CH.handSpeed = chLag.handSpeed(raw, tSec);
    CH.handAccel = Math.max(0, CH.handSpeed - chPrevSpeed);   // chỉ bắt lúc TĂNG tốc, giảm tốc không kick
    chPrevSpeed = CH.handSpeed;
  } else {
    chPrevMid = null;
    CH.ribbonLen = 0; CH.handSpeed = chLag.handSpeed(0, tSec); CH.handAccel = 0;
  }
  if (hands.length) {
    const avgPinch = hands.reduce((s,h)=>s+h.pinchNorm, 0) / hands.length;
    CH.pinchOpen = chLag.pinch(avgPinch, tSec);
  }
}


let handsFreshThisFrame = false;
function readHands(res){
  hands = [];
  handsFreshThisFrame = true;
  const L = (res && res.landmarks) || [];
  for (const lm of L){
    // trung điểm ngón cái + ngón trỏ (kiểu nhúm/pinch) — nhưng lọc ngón cái riêng trước
    // vì landmark 4 (đầu ngón cái) tự nó nhiễu hơn hẳn landmark 8 trong MediaPipe, dồn
    // hết vào midpoint không lọc là nguồn gốc cảm giác "mông lung" mà Leon báo.
    const thumbPx = { x:(1-lm[4].x)*W, y:lm[4].y*H };
    const indexPx = { x:(1-lm[8].x)*W, y:lm[8].y*H };
    // Đo trên khung ref thật: khi tay ở tư thế nắm hờ chỉ chỉa ngón trỏ (không cố tình
    // nhúm sát), ngón cái-trỏ có thể cách nhau tới 120px/1024 — trung điểm 50/50 rơi vào
    // KHOẢNG TRỐNG giữa 2 ngón, không nằm trên ngón nào cả (thấy rõ qua debug dots) ->
    // đây là nguồn gốc "mông lung". Nghiêng về ngón trỏ (ổn định, luôn đúng đầu ngón)
    // nhưng vẫn cộng thêm ngón cái để còn "cảm" được cả 2, không quay lại index trơ trọi.
    const tip = { x: lm[8].x*0.65 + lm[4].x*0.35, y: lm[8].y*0.65 + lm[4].y*0.35 };
    const hl = Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y) || 1e-6;
    const pw = Math.hypot(lm[5].x-lm[17].x, lm[5].y-lm[17].y);
    const c = Math.max(0, Math.min(1, (pw/hl)/0.95));
    const sign = ((lm[5].z || 0) - (lm[17].z || 0)) >= 0 ? 1 : -1;
    // độ nhúm cái-trỏ CHUẨN HOÁ theo chiều dài bàn tay -> không phụ thuộc khoảng cách tới
    // camera. Đo trên video ref: dao động 0.14 (nhúm chặt) .. 3.3 (xoè hết cỡ), p10=0.67 p90=2.28.
    const pinchNorm = Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y) / hl;
    hands.push({ grip:{ x:(1-tip.x)*W, y:tip.y*H }, thumbPx, indexPx, pinchNorm,
                 roll: Math.acos(Math.max(-1, Math.min(1, c*sign))) });
  }
  twoHandStreak = hands.length >= 2 ? twoHandStreak + 1 : 0;
}

// ---- chấm debug: hiện ĐÚNG chỗ MediaPipe đang thấy ngón cái/ngón trỏ, để soi bằng mắt
// thay vì đoán. Xanh dương = ngón cái, hồng = ngón trỏ, vàng nhỏ = điểm nhúm thô (chưa lọc),
// vàng viền trắng to = điểm neo dải sau khi đã lọc mượt (A/B). Gỡ khi tracking đã ổn.
function drawDebugDots(){
  ctx.save();
  for (const h of hands) {
    ctx.beginPath(); ctx.arc(h.thumbPx.x, h.thumbPx.y, 7*DPR, 0, 7);
    ctx.fillStyle = 'rgba(70,150,255,0.9)'; ctx.fill();
    ctx.beginPath(); ctx.arc(h.indexPx.x, h.indexPx.y, 7*DPR, 0, 7);
    ctx.fillStyle = 'rgba(255,70,180,0.9)'; ctx.fill();
    const rawX = (h.thumbPx.x+h.indexPx.x)/2, rawY = (h.thumbPx.y+h.indexPx.y)/2;
    ctx.beginPath(); ctx.arc(rawX, rawY, 4*DPR, 0, 7);
    ctx.fillStyle = 'rgba(255,220,40,0.95)'; ctx.fill();
  }
  for (const p of [A, B]) {
    if (!p) continue;
    ctx.beginPath(); ctx.arc(p.x, p.y, 10*DPR, 0, 7);
    ctx.fillStyle = 'rgba(255,220,40,0.55)'; ctx.fill();
    ctx.lineWidth = 2*DPR; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
  }
  ctx.font = `${13*DPR}px -apple-system,sans-serif`; ctx.fillStyle = '#fff';
  ctx.fillText(`tay: ${hands.length}  xanh=cái  hồng=trỏ  vàng nhỏ=nhúm thô  vàng to=neo đã lọc`, 10*DPR, 24*DPR);
  ctx.restore();
}

function bindHands(){
  if (!hands.length) return null;
  // chỉ tin "2 tay" khi ổn định liên tục (xem giải thích ở khai báo twoHandStreak) — phát
  // hiện đôi loé 1-2 khung thì rơi xuống nhánh 1-tay, mà nhánh đó cần A/B đã tồn tại từ
  // trước mới làm gì được -> 1 tay giơ đơn độc từ trạng thái đóng không thể mở dải nữa.
  if (hands.length >= 2 && twoHandStreak >= TWO_HAND_STREAK_MIN) {
    const [p,q] = [...hands].sort((x,y)=>x.grip.x-y.grip.x);
    if (A && B) {
      const straight = Math.hypot(p.grip.x-A.x,p.grip.y-A.y)+Math.hypot(q.grip.x-B.x,q.grip.y-B.y);
      const swapped  = Math.hypot(q.grip.x-A.x,q.grip.y-A.y)+Math.hypot(p.grip.x-B.x,p.grip.y-B.y);
      return swapped < straight ? [q,p] : [p,q];
    }
    return [p,q];
  }
  const h = hands[0];
  if (!A || !B) return null;
  return Math.hypot(h.grip.x-A.x,h.grip.y-A.y) <= Math.hypot(h.grip.x-B.x,h.grip.y-B.y) ? [h,null] : [null,h];
}

function updateRibbon(dt){
  tSec += dt;
  const pair = bindHands();
  const isNew = handsFreshThisFrame; handsFreshThisFrame = false;

  if (pair) {
    const [p,q] = pair;
    if (!A && p) { A = {...p.grip}; rollA = p.roll; rawA = {...p.grip}; }
    if (!B && q) { B = {...q.grip}; rollB = q.roll; rawB = {...q.grip}; }
    // model tay chạy CHẬM hơn 60fps render (~14-20ms/lần) -> chỉ khi có detect MỚI mới
    // đo vận tốc thật; giữa các lần đó thì NGOẠI SUY theo vận tốc đó thay vì đứng yên rồi
    // nhảy — đây là nguồn gốc chính của cảm giác "chưa mượt/giật".
    if (isNew) {
      const dtReal = Math.max(1/60, tSec - lastDetectT);
      if (p && rawA) { velA = { x:(p.grip.x-rawA.x)/dtReal, y:(p.grip.y-rawA.y)/dtReal }; rawA = {...p.grip}; }
      if (q && rawB) { velB = { x:(q.grip.x-rawB.x)/dtReal, y:(q.grip.y-rawB.y)/dtReal }; rawB = {...q.grip}; }
      lastDetectT = tSec;
    }
    if (p && A) { rollA = lerpA(rollA, p.roll, Math.min(1, dt*8)); seenA = tSec; }
    if (q && B) { rollB = lerpA(rollB, q.roll, Math.min(1, dt*8)); seenB = tSec; }
  }
  // ngoại suy vị trí RAW theo vận tốc MỖI khung (kể cả khung không có detect mới), rồi mới
  // đưa qua OneEuro để mượt nhiễu nhỏ -> chuyển động liên tục thay vì bậc thang.
  if (A && rawA) {
    if (!isNew) { rawA.x += velA.x*dt; rawA.y += velA.y*dt; velA.x *= 0.90; velA.y *= 0.90; }
    A.x = fA.x(rawA.x, tSec); A.y = fA.y(rawA.y, tSec);
  }
  if (B && rawB) {
    if (!isNew) { rawB.x += velB.x*dt; rawB.y += velB.y*dt; velB.x *= 0.90; velB.y *= 0.90; }
    B.x = fB.x(rawB.x, tSec); B.y = fB.y(rawB.y, tSec);
  }
  const fresh = A && B && (tSec-seenA) < GRACE && (tSec-seenB) < GRACE;
  let gate = 0;
  if (fresh) {
    const d = Math.hypot(B.x-A.x, B.y-A.y) / Math.max(1,W);
    if (d < 0.08) pairEverClose = true;   // xác nhận đã từng "chụm sát" -- xem giải thích ở khai báo
    if (pairEverClose) {
      const u = Math.max(0, Math.min(1, (d-0.10)/0.12));
      gate = u*u*(3-2*u); hadHands = true;
    }
  }
  if (!(alive >= 0)) alive = 0;
  alive += (gate-alive) * Math.min(1, dt*(gate>alive?14:8));
  if (!fresh && hadHands && alive < 0.05) {
    worldIdx = (worldIdx+1) % WORLDS.length; applyWorld();
    hadHands = false; A = B = null; ambient = []; pairEverClose = false;
    rawA = rawB = null; velA = {x:0,y:0}; velB = {x:0,y:0};
    fA = { x:OneEuro(2.2,0.9,1.0), y:OneEuro(2.2,0.9,1.0) }; fB = { x:OneEuro(2.2,0.9,1.0), y:OneEuro(2.2,0.9,1.0) };
  }
  for (const s of sparks){ s.life -= dt*1.8; s.x += s.vx*dt*60; s.y += s.vy*dt*60; }
  sparks = sparks.filter(s=>s.life>0);

  // hạt năng lượng lơ lửng bên trong dải khi mở — trôi chậm lên trên, đổi hướng nhẹ
  if (alive > 0.15 && A && B && ambient.length < 26 && Math.random() < 0.5) {
    const t = Math.random(), x = lerpA(A.x,B.x,t) + (Math.random()-0.5)*40*DPR;
    const y = Math.max(A.y,B.y) + Math.random()*60*DPR;
    ambient.push({ x, y, vx:(Math.random()-0.5)*0.25, vy:-(0.4+Math.random()*0.7),
                    life:1, decay:0.16+Math.random()*0.12, sway:Math.random()*6.283 });
  }
  for (const p of ambient){ p.life -= dt*p.decay; p.sway += dt*2;
    p.x += (p.vx + Math.sin(p.sway)*0.3) * dt*60; p.y += p.vy*dt*60; }
  ambient = ambient.filter(p=>p.life>0);

  updateChannels(dt);
}

const radCache = {};
function radial(hex){
  if (radCache[hex]) return radCache[hex];
  const c = document.createElement('canvas'); c.width=c.height=128;
  const cc = c.getContext('2d');
  const g = cc.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,`rgba(${hex},1)`); g.addColorStop(0.4,`rgba(${hex},0.45)`); g.addColorStop(1,`rgba(${hex},0)`);
  cc.fillStyle=g; cc.fillRect(0,0,128,128);
  return radCache[hex]=c;
}

const SLICES = 48;
function drawRibbon(){
  if (alive < 0.02 || !A || !B) return;
  const w = WORLDS[worldIdx];
  const dx=B.x-A.x, dy=B.y-A.y;
  const len = Math.max(Math.hypot(dx,dy), 60*DPR);
  const ang = Math.atan2(dy,dx);
  // độ nhúm cái-trỏ (kênh CH.pinchOpen) điều khiển ĐỘ RỘNG dải một cách LIÊN TỤC —
  // đo trên video ref: p10=0.67 (nhúm) .. p90=2.28 (xoè) -> map tuyến tính có clamp sang
  // hệ số 0.55..1.60. Tách hẳn khỏi vị trí neo (đã cố định 65/35 để hết "mông lung") nên
  // nhúm/nhả không làm neo trôi, chỉ đổi độ dày dải — đúng ý "1 chuỗi motion" liên tục.
  const pinchT = Math.max(0, Math.min(1, (CH.pinchOpen - 0.67) / (2.28 - 0.67)));
  const pinchScale = 0.55 + pinchT * 1.05;
  const maxH = Math.min(Math.max(len*0.42, 90*DPR), H*0.42) * pinchScale;
  const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
  const sw = len/SLICES;
  const top=[], bot=[], cs=[];
  for (let i=0;i<=SLICES;i++){
    const c = Math.cos(lerpA(rollA, rollB, i/SLICES));
    const hh = Math.abs(c)*maxH/2;
    cs.push(c);
    const x = -len/2 + i*sw;
    top.push({x, y:-hh}); bot.push({x, y:hh});
  }
  // --- ô cửa: nội dung giữ nguyên hệ trục màn hình, dải chỉ xén ---
  ctx.save();
  ctx.translate(mx,my); ctx.rotate(ang);
  ctx.beginPath();
  for (let i=0;i<=SLICES;i++) i?ctx.lineTo(top[i].x,top[i].y):ctx.moveTo(top[0].x,top[0].y);
  for (let i=SLICES;i>=0;i--) ctx.lineTo(bot[i].x,bot[i].y);
  ctx.closePath(); ctx.clip();
  ctx.save(); ctx.rotate(-ang); ctx.translate(-mx,-my);
  ctx.globalAlpha = alive;
  ctx.drawImage(glc, 0, 0, W, H);
  // hạt năng lượng lơ lửng — vẽ NGAY TRONG vùng clip của dải, không tràn ra ngoài
  ctx.globalCompositeOperation = 'lighter';
  for (const p of ambient) {
    ctx.globalAlpha = Math.min(p.life, 1-p.life+0.4) * alive * 0.8;
    const r = 3.5*DPR*(0.5+p.life*0.5);
    ctx.drawImage(radial(w.spark), p.x-r, p.y-r, r*2, r*2);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  let i0=0;
  while (i0 < SLICES){
    let i1=i0; while (i1<SLICES && (cs[i1]<0)===(cs[i0]<0)) i1++;
    if (cs[i0]<0){ ctx.globalAlpha = alive*0.45; ctx.fillStyle='#000';
      ctx.fillRect(-len/2+i0*sw, -maxH, (i1-i0)*sw, maxH*2); }
    i0=i1;
  }
  ctx.globalAlpha=1; ctx.restore();
  // --- viền phát sáng ---
  ctx.save(); ctx.translate(mx,my); ctx.rotate(ang);
  ctx.globalCompositeOperation='lighter'; ctx.lineJoin='round'; ctx.lineCap='round';
  for (const [wd,al,col] of [[18*DPR,0.13,`rgba(${w.edge},1)`],[8*DPR,0.30,`rgba(${w.edge},1)`],
                             [3*DPR,0.62,`rgba(${w.edge},1)`],[1.5*DPR,0.95,'rgba(255,252,255,1)']]){
    ctx.globalAlpha = alive*al; ctx.lineWidth=wd; ctx.strokeStyle=col;
    for (const pts of [top,bot]){ ctx.beginPath();
      pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); }
  }
  for (let i=1;i<=SLICES;i++) if (cs[i-1]*cs[i] < 0){
    const gx=-len/2+i*sw, r=maxH*0.22;
    ctx.globalAlpha = alive*0.55; ctx.drawImage(radial(w.spark), gx-r, -r, r*2, r*2);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.restore();
  if (alive>0.5 && Math.random()<0.5) for (const e of [A,B]){
    const a=Math.random()*6.283, v=0.6+Math.random()*1.6;
    sparks.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1});
  }
}

// ===================== Lớp thế giới (GL) =====================
// ma trận: uv màn hình -> uv ảnh mặt nạ, dựng từ tư thế đầu THẬT
function drawQuad(){ gl.drawArrays(gl.TRIANGLES, 0, 3); }

// Pass BEAUTY: video thật -> fboBeauty (mịn da nhẹ, KHÔNG mirror — bộ lọc ảnh thuần,
// giữ nguyên hệ toạ độ để thay thế texCam ở bất kỳ đâu mà không phá logic mirror sẵn có).
function renderBeauty(){
  ensurePipeline(VW, VH);
  gl.bindVertexArray(vao);
  pushTex(0, texCam, video);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboBeauty.fb);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progBeauty);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texCam);
  gl.uniform2f(uBeauty.uPixel, 1/VW, 1/VH);
  drawQuad();
}

// Dải đóng: không cần chạy cả pipeline 6-pass nặng, chỉ hiện camera đã beauty (tự mirror
// giống FS_FRESH để glc luôn nhất quán, Canvas2D không cần mirror riêng nữa).
function renderBeautyOnly(){
  renderBeauty();   // phải tự chạy beauty mỗi khung — renderWorld() không được gọi lúc dải đóng
  if (glc.width !== VW || glc.height !== VH) { glc.width = VW; glc.height = VH; }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progBlit); gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboBeauty.tex);
  drawQuad();
}

function renderWorld(){
  if (!VW) return;
  ensurePipeline(VW, VH);
  renderBeauty();
  gl.bindVertexArray(vao);

  // Pass 1 FRESH: người + nền của khung này (chưa vệt) — uCam giờ là fboBeauty (đã mịn da)
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboFresh.fb);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progFresh);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboBeauty.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, maskTex || blank1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texBg);
  const va = VW/VH, Z = 0.72;   // zoom nền để không lộ viền khung tranh
  gl.uniform2f(uFresh.uBgFit, (va > bgAspect ? 1 : bgAspect/va)*Z, (va > bgAspect ? va/bgAspect : 1)*Z);
  gl.uniform2f(uFresh.uPixel, 1/VW, 1/VH);
  gl.uniform3fv(uFresh.uTint, WORLDS[worldIdx].tint);
  gl.uniform1f(uFresh.uTime, tSec);
  gl.uniform1f(uFresh.uTurb, Math.min(2, CH.handSpeed * 22));   // kênh handSpeed -> độ nhiễu warp
  drawQuad();

  // Pass 2 COMBINE: feedback ping-pong — trail cũ + khung mới -> vệt ghi vào FBO còn lại
  const w = 1 - trailRead;
  gl.bindFramebuffer(gl.FRAMEBUFFER, trail[w].fb);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progCombine);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[trailRead].tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fboFresh.tex);
  gl.uniform1f(uCombine.uDecay, 0.90);
  gl.uniform2f(uCombine.uDrift, Math.sin(tSec*0.21)*0.0009, Math.cos(tSec*0.17)*0.0007);
  gl.uniform1f(uCombine.uZoom, 1.004);
  gl.uniform1f(uCombine.uKick, Math.min(1, CH.handAccel * 45));   // kênh handAccel -> kick vào trail
  drawQuad();
  trailRead = w;

  // Pass 3 BRIGHT (1/4 res): trích vùng sáng cho bloom
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomBright.fb);
  gl.viewport(0,0,bloomBright.w,bloomBright.h);
  gl.useProgram(progBright);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[trailRead].tex);
  drawQuad();

  // Pass 4/5 BLUR: Gaussian tách trục, ngang rồi dọc, vẫn ở 1/4 res
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomBlurA.fb);
  gl.viewport(0,0,bloomBlurA.w,bloomBlurA.h);
  gl.useProgram(progBlur);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomBright.tex);
  gl.uniform2f(uBlur.uTexel, 1/bloomBright.w, 1/bloomBright.h);
  gl.uniform2f(uBlur.uDir, 1, 0);
  drawQuad();

  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomBlurB.fb);
  gl.viewport(0,0,bloomBlurB.w,bloomBlurB.h);
  gl.useProgram(progBlur);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomBlurA.tex);
  gl.uniform2f(uBlur.uTexel, 1/bloomBlurA.w, 1/bloomBlurA.h);
  gl.uniform2f(uBlur.uDir, 0, 1);
  drawQuad();

  // Pass 6 PRESENT: hợp bloom + chromatic aberration + vignette + grain -> vẽ ra CHÍNH canvas glc
  if (glc.width !== VW || glc.height !== VH) { glc.width = VW; glc.height = VH; }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progPresent);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[trailRead].tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomBlurB.tex);
  gl.uniform1f(uPresent.uTime, tSec);
  drawQuad();
}

// Đo lại bằng HandLandmarker SẠCH trên 60 khung liên tiếp của video ref: tỉ lệ bắt
// đủ 2 tay là 0.72-0.77 khi nạp thẳng video (960x720/576px), nhưng 0.82 khi thu nhỏ
// còn 320px. Độ phân giải KHÔNG ảnh hưởng tốc độ trên GPU (đúng như nghiên cứu nói)
// nhưng ẢNH HƯỞNG ĐỘ NHẬN DIỆN — hai chuyện khác nhau. Chỉ áp cho TAY (mặt/người
// không cần, không ai kêu hỏng).
const HAND_IN_W = 320;
const handCv = document.createElement('canvas'); const handCtx = handCv.getContext('2d');
function handInput(){
  if (!VW) return video;
  const w = HAND_IN_W, h = Math.max(1, Math.round(HAND_IN_W*VH/VW));
  if (handCv.width !== w || handCv.height !== h) { handCv.width = w; handCv.height = h; }
  handCtx.drawImage(video, 0, 0, w, h);
  return handCv;
}

// ===================== Vòng chạy =====================
let last = performance.now(), tsCounter = 0;
let hasNewFrame = true, lastVFC = 0;
if (video.requestVideoFrameCallback) {
  const tick = () => { hasNewFrame = true; lastVFC = performance.now();
                       video.requestVideoFrameCallback(tick); };
  video.requestVideoFrameCallback(tick);
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (!ready || video.readyState < 2) return;
  if (!VW) { VW = video.videoWidth; VH = video.videoHeight; }
  if (!VW) return;
  // chỉ chạy model khi có khung camera mới; nhưng nếu rVFC im quá 0,4s (trình duyệt
  // không hỗ trợ / bị bóp) thì vẫn chạy, để app không bao giờ đứng hình
  const fresh = hasNewFrame || (now - lastVFC > 400);
  hasNewFrame = false;

  const src = video;   // nạp thẳng từ video, không blit qua canvas
  // MediaPipe dùng chung một đồng hồ mốc thời gian cho mọi task trong cùng WASM module
  // (không phải mỗi task một đồng hồ riêng) -> mỗi lệnh gọi PHẢI lấy mốc mới, không
  // được dùng lại cùng một số cho hai task khác nhau trong cùng khung.
  if (fresh) try {
    readHands(hand.detectForVideo(handInput(), ++tsCounter));
    // tách người chỉ chạy khi dải đang mở/sắp mở — model rẻ (<1ms) nên chạy mỗi khung
    if (alive > 0.02 || hands.length >= 2) {
      seg.segmentForVideo(src, ++tsCounter, r => {
        const mk = r.confidenceMasks && r.confidenceMasks[0];
        if (mk) maskTex = mk.getAsWebGLTexture();
      });
    }
  } catch(e){ /* một khung lỗi thì bỏ qua, không giết vòng chạy */ }

  updateRibbon(dt);
  // dải mở: chạy đủ pipeline 6-pass; dải đóng: chỉ beauty+blit, rẻ hơn nhiều — cả 2 nhánh
  // đều ghi ra glc đã "mirror đúng" sẵn trong shader, Canvas2D dưới đây không cần tự mirror nữa
  if (alive > 0.02) renderWorld(); else renderBeautyOnly();

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  const s = Math.max(W/VW, H/VH), dw = VW*s, dh = VH*s;
  ctx.drawImage(glc, (W-dw)/2, (H-dh)/2, dw, dh);

  drawRibbon();
  // drawDebugDots();  // đã gỡ theo yêu cầu Leon — bật lại khi cần soi tracking

  const w = WORLDS[worldIdx];
  ctx.globalCompositeOperation='lighter';
  for (const sp of sparks){ ctx.globalAlpha = sp.life*alive; const r = 7*DPR*sp.life;
    ctx.drawImage(radial(w.spark), sp.x-r, sp.y-r, r*2, r*2); }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

// ===================== Khởi động =====================
(async () => {
  try {
    if (!gl) { say('Máy/trình duyệt không hỗ trợ WebGL2'); return; }
    say('đang nạp mô hình…');
    applyWorld();
    await initModels();
    say('đang xin quyền camera…');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width:{ideal:1920}, height:{ideal:1080}, aspectRatio:{ideal:16/9},
               facingMode:'user' }, audio:false });
    video.srcObject = stream;
    await video.play();
    VW = video.videoWidth; VH = video.videoHeight;
    say('');
    requestAnimationFrame(frame);
  } catch(e) {
    say('Lỗi: ' + (e && e.message ? e.message : e));
    console.error(e);
  }
})();
addEventListener('click', () => { worldIdx = (worldIdx+1) % WORLDS.length; applyWorld(); });
</script>
</body>
