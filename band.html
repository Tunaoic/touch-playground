<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dải Băng Xuyên Giới</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  #stage { position:relative; width:100vw; height:100vh; }
  video { display:none; }
  canvas#canvas { position:absolute; inset:0; width:100%; height:100%; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

let W = 0, H = 0, DPR = Math.min(devicePixelRatio, 1.25);
const WS = 0.6;   // 'thế giới bên kia' dựng ở 60% -> nhẹ máy (dải lấy mẫu qua buffer nên không thấy khác)
function resize() {
  W = canvas.width  = Math.round(innerWidth  * DPR);
  H = canvas.height = Math.round(innerHeight * DPR);
  world.width  = Math.max(2, Math.round(W * WS));
  world.height = Math.max(2, Math.round(H * WS));
}
// "thế giới bên kia" — camera đã độ + mặt nạ bám mặt thật
const world = document.createElement('canvas');
const wctx  = world.getContext('2d');
// buffer dải (đã xoay về hệ trục của dải)
const buf   = document.createElement('canvas');
const bctx  = buf.getContext('2d');
addEventListener('resize', resize); resize();

// ================= Themes =================
const THEMES = [
  { id:'hero',   src:'assets/face_hero.jpg',   eye:[0.335,0.455,0.665,0.455],
    mul:'rgba(178,96,64,0.40)', lift:'rgba(34,10,3,1)',  scr:'rgba(255,124,38,0.28)', edge:'255,190,130', spark:'255,200,140' },
  { id:'demon',  src:'assets/face_demon.jpg',  eye:[0.380,0.492,0.640,0.492],
    mul:'rgba(146,100,205,0.42)', lift:'rgba(20,6,40,1)', scr:'rgba(162,80,255,0.30)', edge:'210,165,255', spark:'215,170,255' },
  { id:'dragon', src:'assets/face_dragon.jpg', eye:[0.415,0.452,0.615,0.452],
    mul:'rgba(204,154,66,0.40)', lift:'rgba(32,19,2,1)', scr:'rgba(255,180,48,0.28)', edge:'255,220,160', spark:'255,225,165' },
];
let themeIdx = 0;

// nạp ảnh mặt nạ -> canvas có alpha (ellipse feather, nền đen biến mất)
function prepMask(src) {
  const out = document.createElement('canvas');
  const img = new Image();
  img.onload = () => {
    const S = 512;
    out.width = out.height = S;
    const c = out.getContext('2d');
    c.drawImage(img, 0, 0, S, S);
    // alpha: ellipse mềm ôm lấy khuôn mặt nạ
    const m = document.createElement('canvas'); m.width = m.height = S;
    const mc = m.getContext('2d');
    const g = mc.createRadialGradient(S/2, S*0.5, 0, S/2, S*0.5, S*0.5);
    g.addColorStop(0.00, 'rgba(0,0,0,1)');
    g.addColorStop(0.62, 'rgba(0,0,0,1)');
    g.addColorStop(1.00, 'rgba(0,0,0,0)');
    mc.fillStyle = g;
    mc.save(); mc.translate(S/2, S/2); mc.scale(0.80, 1.10); mc.translate(-S/2, -S/2);
    mc.fillRect(0, 0, S, S); mc.restore();
    c.globalCompositeOperation = 'destination-in';
    c.drawImage(m, 0, 0);
    c.globalCompositeOperation = 'source-over';
    out.ready = true;
  };
  img.src = src;
  return out;
}
THEMES.forEach(t => { t.mask = prepMask(t.src); });

function radial(hex, size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const cc = c.getContext('2d');
  const g = cc.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, `rgba(${hex},1)`); g.addColorStop(0.4, `rgba(${hex},0.45)`);
  g.addColorStop(1, `rgba(${hex},0)`);
  cc.fillStyle = g; cc.fillRect(0, 0, size, size);
  return c;
}
const glowWhite = radial('255,255,255', 128);

// ================= Tracking =================
let hands = [], face = null;
const L = { WRIST:0, TH_TIP:4, IX_MCP:5, IX_TIP:8, MID_MCP:9, PK_MCP:17 };
const refRatio = {};   // tự hiệu chuẩn độ "xoè" của lòng bàn tay mỗi bên

function parseHand(lm, label) {
  const P = p => ({ x: (1 - p.x) * W, y: p.y * H });
  const w = lm[L.WRIST], mid = lm[L.MID_MCP], i5 = lm[L.IX_MCP], p17 = lm[L.PK_MCP];
  const handLen  = Math.hypot(w.x - mid.x, w.y - mid.y) || 1e-6;
  const palmW    = Math.hypot(i5.x - p17.x, i5.y - p17.y);
  const ratio    = palmW / handLen;
  // hiệu chuẩn: nhớ mức xoè lớn nhất từng thấy (rỉ dần để không kẹt)
  const key = label || '0';
  refRatio[key] = Math.max(ratio, (refRatio[key] || 0.72) * 0.997);
  // *1.3: chỉ khi tay thật sự quay nghiêng cạnh dải mới mảnh lại, cầm hờ vẫn mở hết
  let c = Math.min(1, (ratio / Math.max(0.45, refRatio[key])) * 1.3);   // |cos(roll)|
  // mặt lòng bàn tay hay mu bàn tay? -> dấu của tích có hướng 2D
  const ax = i5.x - w.x, ay = i5.y - w.y, bx = p17.x - w.x, by = p17.y - w.y;
  const cross = ax * by - ay * bx;
  const chir  = (label === 'Right') ? 1 : -1;
  const sign  = (cross * chir) >= 0 ? 1 : -1;
  const roll  = Math.acos(Math.max(-1, Math.min(1, c * sign)));  // 0 = ngửa, π = úp
  const th = P(lm[L.TH_TIP]), ix = P(lm[L.IX_TIP]);
  return {
    label,
    grip: { x: (th.x + ix.x) / 2, y: (th.y + ix.y) / 2 },   // điểm "cầm" dải
    roll, size: handLen * H
  };
}

// ================= Ribbon state =================
let A = null, B = null, rollA = 0, rollB = 0;  // hai đầu dải đã làm mượt
let alive = 0, hadHands = false, sparks = [], tSec = 0;

function lerpA(a, b, t) { return a + (b - a) * t; }

function update(dt) {
  tSec += dt;
  const two = hands.length >= 2;
  // hai tay chụm sát nhau -> chưa có dải; KÉO RA thì dải mới hiện (đúng nhịp ref)
  let gate = 0;
  if (two) {
    const [p0, q0] = [...hands].sort((x, y) => x.grip.x - y.grip.x);
    const d = Math.hypot(q0.grip.x - p0.grip.x, q0.grip.y - p0.grip.y) / Math.max(1, W);
    const u = Math.max(0, Math.min(1, (d - 0.10) / 0.12));
    gate = u * u * (3 - 2 * u);
  }
  if (!(alive >= 0)) alive = 0;                       // chống NaN khi khung hình cỡ 0
  alive += (gate - alive) * Math.min(1, dt * (gate > alive ? 14 : 8));

  if (two) {
    hadHands = true;
    const [p, q] = [...hands].sort((x, y) => x.grip.x - y.grip.x);
    const k = Math.min(1, dt * 18);
    if (!A) { A = { ...p.grip }; B = { ...q.grip }; rollA = p.roll; rollB = q.roll; }
    A.x = lerpA(A.x, p.grip.x, k); A.y = lerpA(A.y, p.grip.y, k);
    B.x = lerpA(B.x, q.grip.x, k); B.y = lerpA(B.y, q.grip.y, k);
    rollA = lerpA(rollA, p.roll, Math.min(1, dt * 8));
    rollB = lerpA(rollB, q.roll, Math.min(1, dt * 8));
  } else if (hadHands && alive < 0.05) {
    themeIdx = (themeIdx + 1) % THEMES.length;   // mất tay -> đổi thế giới
    hadHands = false; A = B = null;
  }

  for (const s of sparks) { s.life -= dt * 1.8; s.x += s.vx * dt * 60; s.y += s.vy * dt * 60; }
  sparks = sparks.filter(s => s.life > 0);
}

// ================= Thế giới bên kia =================
function drawWorld(th) {
  wctx.setTransform(WS, 0, 0, WS, 0, 0);
  wctx.clearRect(0, 0, W, H);
  if (video.readyState < 2) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
  const ox = (W - dw) / 2, oy = (H - dh) / 2;
  wctx.save(); wctx.translate(W, 0); wctx.scale(-1, 1);
  wctx.drawImage(video, ox, oy, dw, dh);
  wctx.globalCompositeOperation = 'overlay';       // tăng tương phản
  wctx.globalAlpha = 0.45;
  wctx.drawImage(video, ox, oy, dw, dh);
  wctx.restore();
  wctx.globalAlpha = 1;

  wctx.globalCompositeOperation = 'multiply';      // nhuộm màu theo hệ
  wctx.fillStyle = th.mul; wctx.fillRect(0, 0, W, H);
  wctx.globalCompositeOperation = 'lighter';       // nâng sáng: dải phải RỰC hơn đời thật
  wctx.fillStyle = th.lift; wctx.fillRect(0, 0, W, H);
  wctx.globalCompositeOperation = 'screen';        // hắt sáng màu
  const g = wctx.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, Math.max(W, H) * 0.7);
  g.addColorStop(0, th.scr); g.addColorStop(1, 'rgba(0,0,0,0)');
  wctx.fillStyle = g; wctx.fillRect(0, 0, W, H);

  // đốm sáng bokeh trôi
  for (let i = 0; i < 7; i++) {
    const px = ((i * 0.173 + tSec * 0.012 * (i % 3 + 1)) % 1.2 - 0.1) * W;
    const py = (0.18 + 0.63 * ((i * 0.37) % 1)) * H;
    const r  = (26 + (i % 4) * 20) * DPR;
    wctx.globalAlpha = 0.5;
    wctx.drawImage(radialCache(th.spark), px - r, py - r, r * 2, r * 2);
  }
  wctx.globalAlpha = 1;
  wctx.globalCompositeOperation = 'source-over';

  // mặt nạ bám ĐÚNG khuôn mặt thật
  if (face && th.mask.ready) {
    const [ex1, ey1, ex2, ey2] = th.eye;
    const mS = th.mask.width;
    const mDx = (ex2 - ex1) * mS, mDy = (ey2 - ey1) * mS;
    const mDist = Math.hypot(mDx, mDy) || 1;
    const scale = (face.dist * 1.06) / mDist;
    const mcx = (ex1 + ex2) / 2 * mS, mcy = (ey1 + ey2) / 2 * mS;
    wctx.save();
    wctx.translate(face.cx, face.cy);
    wctx.rotate(face.ang);
    wctx.scale(scale, scale);
    wctx.globalAlpha = 0.86;   // hé lộ mặt thật xuyên qua, như ref
    wctx.drawImage(th.mask, -mcx, -mcy);
    wctx.restore();
    // mắt rực sáng đúng vị trí mắt thật
    wctx.globalCompositeOperation = 'lighter';
    for (const e of [face.eL, face.eR]) {
      const r = face.dist * 0.42;
      wctx.globalAlpha = 0.85 + 0.15 * Math.sin(tSec * 7);
      wctx.drawImage(glowWhite, e.x - r, e.y - r, r * 2, r * 2);
    }
    wctx.globalAlpha = 1;
    wctx.globalCompositeOperation = 'source-over';
  }
}
const _rcache = {};
function radialCache(hex) { return _rcache[hex] || (_rcache[hex] = radial(hex, 128)); }

// ================= Vẽ dải xoắn =================
const SLICES = 46;
const layer = document.createElement('canvas');   // dựng dải ở alpha=1 rồi mới hoà mờ
const lctx  = layer.getContext('2d');

function drawRibbon() {
  if (alive < 0.02 || !A || !B) return;
  const th = THEMES[themeIdx];
  const dx = B.x - A.x, dy = B.y - A.y;
  const len = Math.max(Math.hypot(dx, dy), 60 * DPR);
  const ang = Math.atan2(dy, dx);
  const maxH = Math.min(Math.max(len * 0.42, 90 * DPR), H * 0.42);
  const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;

  drawWorld(th);

  // buffer: thế giới bên kia xoay về hệ trục của dải
  const bw = Math.max(8, Math.min(1400, Math.round(len)));
  const bh = Math.max(8, Math.min(460,  Math.round(maxH)));
  if (buf.width !== bw || buf.height !== bh) { buf.width = bw; buf.height = bh; }
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, bw, bh);
  bctx.save();
  bctx.translate(bw / 2, bh / 2);
  bctx.scale(bw / len, bh / maxH);
  bctx.rotate(-ang);
  bctx.translate(-mx, -my);
  bctx.drawImage(world, 0, 0, W, H);
  bctx.restore();

  // khung bao của dải (đã xoay) + lề cho quầng sáng
  const ca = Math.abs(Math.cos(ang)), sa = Math.abs(Math.sin(ang)), marg = 30 * DPR;
  const lw = Math.min(4096, Math.ceil((len * ca + maxH * sa) / 2 + marg) * 2);
  const lh = Math.min(4096, Math.ceil((len * sa + maxH * ca) / 2 + marg) * 2);
  if (layer.width !== lw || layer.height !== lh) { layer.width = lw; layer.height = lh; }
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.clearRect(0, 0, lw, lh);
  lctx.save();
  lctx.translate(lw / 2, lh / 2);
  lctx.rotate(ang);

  // hình học xoắn: nửa chiều cao mỗi lát = |cos(roll)| -> tự thắt eo thành nơ
  const sw = len / SLICES, bsw = bw / SLICES;
  const topPts = [], botPts = [], hs = [], cs = [];
  for (let i = 0; i < SLICES; i++) {
    const c  = Math.cos(lerpA(rollA, rollB, (i + 0.5) / SLICES));
    const hh = Math.abs(c) * maxH / 2;
    cs.push(c); hs.push(hh);
    const xc = -len / 2 + i * sw + sw / 2;
    topPts.push({ x: xc, y: -hh });
    botPts.push({ x: xc, y:  hh });
  }

  lctx.save();
  lctx.beginPath();
  lctx.moveTo(-len / 2, -hs[0]);
  for (const p of topPts) lctx.lineTo(p.x, p.y);
  lctx.lineTo(len / 2, -hs[SLICES - 1]);
  lctx.lineTo(len / 2,  hs[SLICES - 1]);
  for (let i = SLICES - 1; i >= 0; i--) lctx.lineTo(botPts[i].x, botPts[i].y);
  lctx.lineTo(-len / 2, hs[0]);
  lctx.closePath();
  lctx.clip();                       // mép do bóng quyết định -> lát chồng nhau vô hại

  const ov = sw * 0.9, ovs = ov * bsw / sw;
  for (let i = 0; i < SLICES; i++) {
    const hh = hs[i], c = cs[i];
    if (hh <= 0.4) continue;
    const x0 = -len / 2 + i * sw;
    const si = (c >= 0) ? i : (SLICES - 1 - i);      // mặt lưng soi gương
    const sx = Math.max(0, si * bsw - ovs);
    const sWid = Math.min(bw - sx, bsw + ovs * 2);
    lctx.drawImage(buf, sx, 0, sWid, bh, x0 - ov, -hh, sw + ov * 2, hh * 2);
    if (c < 0) {
      lctx.fillStyle = th.mul;
      lctx.fillRect(x0 - ov, -hh, sw + ov * 2, hh * 2);
      lctx.globalCompositeOperation = 'lighter';
      lctx.fillStyle = `rgba(${th.edge},0.10)`;
      lctx.fillRect(x0 - ov, -hh, sw + ov * 2, hh * 2);
      lctx.globalCompositeOperation = 'source-over';
    }
  }
  lctx.restore();

  // viền phát sáng chạy theo mép trên/dưới (tự thắt lại ở chỗ xoắn)
  lctx.globalCompositeOperation = 'lighter';
  const pulse = 0.72 + 0.28 * Math.sin(tSec * 8);
  for (const [wd, al] of [[16 * DPR, 0.18 * pulse], [7 * DPR, 0.38 * pulse], [3 * DPR, 0.75 * pulse], [1.4 * DPR, 1.0 * pulse]]) {
    lctx.lineWidth = wd; lctx.lineJoin = 'round'; lctx.lineCap = 'round';
    lctx.strokeStyle = `rgba(${th.edge},${al})`;
    for (const pts of [topPts, botPts]) {
      lctx.beginPath();
      pts.forEach((p, i) => i ? lctx.lineTo(p.x, p.y) : lctx.moveTo(p.x, p.y));
      lctx.stroke();
    }
  }
  // ánh loé ở chỗ dải quay nghiêng cạnh (nút thắt của nơ)
  for (let i = 1; i < SLICES; i++) {
    if (cs[i - 1] * cs[i] < 0) {
      const gx = -len / 2 + i * sw, r = maxH * 0.45;
      lctx.drawImage(radialCache(th.spark), gx - r, -r, r * 2, r * 2);
    }
  }
  lctx.globalCompositeOperation = 'source-over';
  lctx.restore();

  // hoà cả dải vào cảnh MỘT lần -> không còn sọc do chồng lát khi mờ dần
  ctx.globalAlpha = alive;
  ctx.drawImage(layer, mx - lw / 2, my - lh / 2);
  ctx.globalAlpha = 1;

  // hào quang hắt ra quanh dải
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alive * 0.16;
  const gr = maxH * 1.5;
  ctx.drawImage(radialCache(th.edge), mx - gr, my - gr, gr * 2, gr * 2);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // tia sáng bắn ra hai đầu
  if (alive > 0.5 && Math.random() < 0.55) {
    for (const e of [A, B]) {
      const a = Math.random() * Math.PI * 2, v = 0.7 + Math.random() * 1.8;
      sparks.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
    }
  }
}

// ================= Loop =================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (video.readyState >= 2) {                 // nền: đời thật
    const vw = video.videoWidth, vh = video.videoHeight;
    const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
    ctx.restore();
  }

  update(dt);
  drawRibbon();

  const th = THEMES[themeIdx];
  ctx.globalCompositeOperation = 'lighter';
  for (const s of sparks) {
    ctx.globalAlpha = s.life * alive;
    const r = 7 * DPR * s.life;
    ctx.drawImage(radialCache(th.spark), s.x - r, s.y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ================= MediaPipe =================
const mpHands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
mpHands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
let handsWarm = false;
mpHands.onResults(r => {
  handsWarm = true;      // model tay chạy được rồi mới cho model mặt chen vào
  hands = (r.multiHandLandmarks || []).map((lm, i) =>
    parseHand(lm, r.multiHandedness?.[i]?.label || String(i)));
});

const mpFace = new FaceDetection({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${f}` });
mpFace.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
mpFace.onResults(r => {
  const d = r.detections && r.detections[0];
  if (!d || !d.landmarks) { return; }
  const P = p => ({ x: (1 - p.x) * W, y: p.y * H });
  const e1 = P(d.landmarks[0]), e2 = P(d.landmarks[1]);   // hai mắt
  const eL = e1.x < e2.x ? e1 : e2, eR = e1.x < e2.x ? e2 : e1;
  const cx = (eL.x + eR.x) / 2, cy = (eL.y + eR.y) / 2;
  const dist = Math.hypot(eR.x - eL.x, eR.y - eL.y);
  const ang  = Math.atan2(eR.y - eL.y, eR.x - eL.x);
  if (!face) face = { cx, cy, dist, ang, eL, eR };
  else {
    const k = 0.4;
    face.cx += (cx - face.cx) * k; face.cy += (cy - face.cy) * k;
    face.dist += (dist - face.dist) * k;
    face.ang += (ang - face.ang) * k;
    face.eL = eL; face.eR = eR;
  }
});

// gửi frame KHÔNG chặn (mỗi model một cờ + watchdog) — tránh treo pipeline
let hBusy = false, hT = 0, fBusy = false, fT = 0, frameNo = 0;
const camera = new Camera(video, {
  onFrame: async () => {
    const now = performance.now();
    if (hBusy && now - hT > 1500) hBusy = false;
    if (fBusy && now - fT > 1500) fBusy = false;
    frameNo++;
    if (!hBusy) {
      hBusy = true; hT = now;
      mpHands.send({ image: video }).catch(() => {}).finally(() => { hBusy = false; });
    }
    if (handsWarm && frameNo % 3 === 0 && !fBusy) {   // mặt đổi chậm -> 1/3 nhịp là đủ
      fBusy = true; fT = now;
      mpFace.send({ image: video }).catch(() => {}).finally(() => { fBusy = false; });
    }
  },
  width: 640, height: 480
});
camera.start().catch(e => console.warn('camera:', e && e.message));
addEventListener('click', () => { themeIdx = (themeIdx + 1) % THEMES.length; });
</script>
