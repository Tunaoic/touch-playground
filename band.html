<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dải Băng Xuyên Giới</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  #stage { position:relative; width:100vw; height:100vh; }
  video, #gl { display:none; }
  #view { position:absolute; inset:0; width:100%; height:100%; }
  #msg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
         color:#cfe3ff; font:14px -apple-system,sans-serif; text-align:center;
         background:rgba(6,10,20,.7); padding:10px 18px; border-radius:14px;
         border:1px solid rgba(150,190,255,.25); z-index:5; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="gl"></canvas>
  <canvas id="view"></canvas>
  <div id="msg">đang nạp…</div>
</div>

<!-- tasks-vision 1.0.1: bản IIFE, chạy bằng thẻ script thường, phơi global `Vision` -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.js"></script>
<script>
const video = document.getElementById('video');
const glc   = document.getElementById('gl');
const view  = document.getElementById('view');
const ctx   = view.getContext('2d');
const msg   = document.getElementById('msg');
const say   = t => { msg.textContent = t; msg.style.display = t ? '' : 'none'; };

const DPR = Math.min(devicePixelRatio, 1.25);
let W = 0, H = 0, VW = 0, VH = 0;
function resize() {
  W = view.width  = Math.round(innerWidth  * DPR);
  H = view.height = Math.round(innerHeight * DPR);
}
addEventListener('resize', resize); resize();

// ===================== Thế giới =====================
const WORLDS = [
  { id:'spider',
    face:'assets/face_hero.jpg',   bg:'assets/bg_city.jpg',
    suitDark:[0.04,0.07,0.34], suitLite:[0.96,0.11,0.13],
    accent:[0.10,0.16,0.55], web:1.0,
    edge:'255,190,130', spark:'255,205,150' },
  { id:'oni',
    face:'assets/face_demon.jpg',  bg:'assets/bg_void.jpg',
    suitDark:[0.16,0.05,0.30], suitLite:[0.62,0.30,0.98],
    accent:[0.95,0.75,0.20], web:0.0,
    edge:'210,165,255', spark:'215,175,255' },
  { id:'dragon',
    face:'assets/face_dragon.jpg', bg:'assets/bg_void.jpg',
    suitDark:[0.30,0.17,0.02], suitLite:[1.00,0.75,0.22],
    accent:[0.90,0.35,0.05], web:0.0,
    edge:'255,220,160', spark:'255,225,170' },
];
let worldIdx = 0;

// ===================== WebGL: lớp "thế giới bên kia" =====================
const gl = glc.getContext('webgl2', { antialias:false, alpha:false, premultipliedAlpha:false });

const VS = `#version 300 es
in vec2 p; out vec2 v;
void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

// Toàn bộ phép biến hình diễn ra ở đây: người -> nhân vật, nền -> thế giới khác
const FS = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uCam, uMask, uBg, uFace;
uniform mat3  uFaceM;        // uv màn hình -> uv ảnh mặt nạ
uniform vec3  uDark, uLite, uAccent;
uniform vec2  uBgFit;        // hệ số "cover" cho ảnh nền
uniform vec3  uBody;         // tâm x,y + cỡ người (suy từ khuôn mặt)
uniform float uWeb, uTime, uFaceOn;

float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }

// mạng nhện thủ tục — neo vào NGƯỜI và co giãn theo cỡ người, không dính màn hình
float webPat(vec2 uv){
  vec2 q = (uv - uBody.xy) / max(uBody.z, 0.02);
  float r = length(q), a = atan(q.y, q.x);
  float rings  = abs(fract(r*9.0) - 0.5);
  float spokes = abs(fract(a*16.0/6.2831) - 0.5);
  return 1.0 - smoothstep(0.0, 0.030, min(rings*1.1, spokes*r*2.6));
}

void main(){
  vec2 uv = vec2(1.0 - v.x, 1.0 - v.y);            // soi gương + lật dọc cho khớp video
  vec3 cam = texture(uCam, uv).rgb;
  float person = texture(uMask, uv).r;
  person = smoothstep(0.35, 0.65, person);          // mép người gọn lại

  // --- nền: thế giới khác ---
  vec2 buv = (uv - 0.5) * uBgFit + 0.5;
  vec3 bg = texture(uBg, vec2(buv.x, 1.0 - buv.y)).rgb;
  bg *= 0.55 + 0.45 * smoothstep(1.0, 0.0, length(uv-0.5));   // tối bốn góc

  // --- người: giữ nguyên sáng tối THẬT, thay chất liệu -> vẫn bám đúng cử động ---
  float l = luma(cam);
  vec3 suit = mix(uDark, uLite, smoothstep(0.06, 0.80, l));
  float w = webPat(uv) * uWeb;
  suit = mix(suit, suit*0.30, w*0.85);                        // chỉ mạng nhện tối
  suit += uAccent * smoothstep(0.62,0.98,l) * 0.30;           // bắt sáng
  suit *= 0.60 + 0.75*l;                                      // giữ khối sáng-tối thật

  vec3 col = mix(bg, suit, person);

  // --- mặt nạ: dán theo ma trận tư thế đầu nên quay đầu vẫn khớp ---
  vec2 fuv = (uFaceM * vec3(uv, 1.0)).xy;
  if (uFaceOn > 0.5) {
    // vùng đặc của mặt nạ = ellipse nằm gọn trong đầu -> nền đen không lọt ra,
    // và mặt thật KHÔNG xuyên qua được
    vec2 d = (fuv - vec2(0.5, 0.47)) / vec2(0.235, 0.455);
    float a = 1.0 - smoothstep(0.80, 1.0, length(d));
    if (a > 0.001) {
      vec4 fm = texture(uFace, clamp(fuv, 0.001, 0.999));
      vec3 fl = fm.rgb * (0.45 + 0.85*l);                     // ăn sáng của cảnh thật
      col = mix(col, fl, a);
    }
  }
  o = vec4(col, 1.0);
}`;

function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const pl = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const uni = { faceM:U('uFaceM'), dark:U('uDark'), lite:U('uLite'), accent:U('uAccent'),
  bgFit:U('uBgFit'), body:U('uBody'), web:U('uWeb'), time:U('uTime'), faceOn:U('uFaceOn') };
gl.uniform1i(U('uCam'),0); gl.uniform1i(U('uMask'),1); gl.uniform1i(U('uBg'),2); gl.uniform1i(U('uFace'),3);

function mkTex(unit){ const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t; }
const texCam = mkTex(0), texBg = mkTex(2), texFace = mkTex(3), blank1 = mkTex(1);
gl.activeTexture(gl.TEXTURE1);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));

const imgCache = {};
function pushTex(unit, tex, src){
  gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
}
function loadTex(unit, tex, src, onload){
  if (imgCache[src]) { pushTex(unit, tex, imgCache[src]); onload && onload(imgCache[src]); return; }
  const im = new Image();
  im.onload = () => { imgCache[src] = im; pushTex(unit, tex, im); onload && onload(im); };
  im.onerror = () => console.warn('thiếu asset:', src);
  im.src = src;
}
let bgAspect = 0.667;
function applyWorld(){
  const w = WORLDS[worldIdx];
  loadTex(3, texFace, w.face);
  loadTex(2, texBg, w.bg, im => { bgAspect = im.naturalWidth/im.naturalHeight; });
  gl.useProgram(prog);
  gl.uniform3fv(uni.dark, w.suitDark); gl.uniform3fv(uni.lite, w.suitLite);
  gl.uniform3fv(uni.accent, w.accent); gl.uniform1f(uni.web, w.web);
}

// ===================== Mô hình =====================
let hand = null, faceLm = null, seg = null, ready = false;
let hands = [], head = null, maskTex = null;

async function initModels(){
  const { FilesetResolver, HandLandmarker, FaceLandmarker, ImageSegmenter } = Vision;
  const fs = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');
  const M = 'https://storage.googleapis.com/mediapipe-models/';
  // canvas: glc -> cả ba model dùng CHUNG context của mình, lấy được mask dạng texture
  hand = await Vision.HandLandmarker.createFromOptions(fs, { canvas: glc, runningMode:'VIDEO', numHands:2,
    minHandDetectionConfidence:0.5, minHandPresenceConfidence:0.5, minTrackingConfidence:0.5,
    baseOptions:{ delegate:'GPU', modelAssetPath: M+'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' }});
  faceLm = await Vision.FaceLandmarker.createFromOptions(fs, { canvas: glc, runningMode:'VIDEO', numFaces:1,
    outputFaceBlendshapes:false, outputFacialTransformationMatrixes:true,
    baseOptions:{ delegate:'GPU', modelAssetPath: M+'face_landmarker/face_landmarker/float16/1/face_landmarker.task' }});
  seg = await Vision.ImageSegmenter.createFromOptions(fs, { canvas: glc, runningMode:'VIDEO',
    outputConfidenceMasks:true, outputCategoryMask:false,
    baseOptions:{ delegate:'GPU', modelAssetPath: M+'image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite' }});
  ready = true;
}

// đầu vào model: 432px là điểm ngọt đo được (nhanh nhất mà bắt tay tốt nhất)
const IN_W = 432;
const inCv = document.createElement('canvas'); const inCtx = inCv.getContext('2d');
function modelInput(){
  if (!VW) return video;
  const w = IN_W, h = Math.max(1, Math.round(IN_W*VH/VW));
  if (inCv.width !== w || inCv.height !== h) { inCv.width = w; inCv.height = h; }
  inCtx.drawImage(video, 0, 0, w, h);
  return inCv;
}

// ---- One Euro Filter: chuẩn khử rung landmark trong AR ----
function OneEuro(minCut=1.2, beta=0.5, dCut=1.0){
  let xPrev=null, dxPrev=0, tPrev=null;
  const a = (cut, dt) => { const r = 2*Math.PI*cut*dt; return r/(r+1); };
  return (x, t) => {
    if (xPrev === null || !isFinite(xPrev)) { xPrev = x; tPrev = t; return x; }
    const dt = Math.max(1e-3, t - tPrev); tPrev = t;
    const dx = (x - xPrev)/dt;
    dxPrev = dxPrev + a(dCut, dt)*(dx - dxPrev);
    xPrev = xPrev + a(minCut + beta*Math.abs(dxPrev), dt)*(x - xPrev);
    return xPrev;
  };
}

// ===================== Dải =====================
const GRACE = 0.55;
let A=null, B=null, rollA=0, rollB=0, seenA=0, seenB=0;
let alive=0, hadHands=false, sparks=[], tSec=0;
let fA = { x:OneEuro(), y:OneEuro() }, fB = { x:OneEuro(), y:OneEuro() };
const lerpA = (a,b,t) => a + (b-a)*t;

function readHands(res){
  hands = [];
  const L = (res && res.landmarks) || [];
  for (const lm of L){
    const tip = lm[8];
    const hl = Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y) || 1e-6;
    const pw = Math.hypot(lm[5].x-lm[17].x, lm[5].y-lm[17].y);
    const c = Math.max(0, Math.min(1, (pw/hl)/0.95));
    const sign = ((lm[5].z || 0) - (lm[17].z || 0)) >= 0 ? 1 : -1;
    hands.push({ grip:{ x:(1-tip.x)*W, y:tip.y*H },
                 roll: Math.acos(Math.max(-1, Math.min(1, c*sign))) });
  }
}

function bindHands(){
  if (!hands.length) return null;
  if (hands.length >= 2) {
    const [p,q] = [...hands].sort((x,y)=>x.grip.x-y.grip.x);
    if (A && B) {
      const straight = Math.hypot(p.grip.x-A.x,p.grip.y-A.y)+Math.hypot(q.grip.x-B.x,q.grip.y-B.y);
      const swapped  = Math.hypot(q.grip.x-A.x,q.grip.y-A.y)+Math.hypot(p.grip.x-B.x,p.grip.y-B.y);
      return swapped < straight ? [q,p] : [p,q];
    }
    return [p,q];
  }
  const h = hands[0];
  if (!A || !B) return null;
  return Math.hypot(h.grip.x-A.x,h.grip.y-A.y) <= Math.hypot(h.grip.x-B.x,h.grip.y-B.y) ? [h,null] : [null,h];
}

function updateRibbon(dt){
  tSec += dt;
  const pair = bindHands();
  if (pair) {
    const [p,q] = pair;
    if (!A && p) { A = {...p.grip}; rollA = p.roll; }
    if (!B && q) { B = {...q.grip}; rollB = q.roll; }
    if (p && A) { A.x = fA.x(p.grip.x, tSec); A.y = fA.y(p.grip.y, tSec);
                  rollA = lerpA(rollA, p.roll, Math.min(1, dt*8)); seenA = tSec; }
    if (q && B) { B.x = fB.x(q.grip.x, tSec); B.y = fB.y(q.grip.y, tSec);
                  rollB = lerpA(rollB, q.roll, Math.min(1, dt*8)); seenB = tSec; }
  }
  const fresh = A && B && (tSec-seenA) < GRACE && (tSec-seenB) < GRACE;
  let gate = 0;
  if (fresh) {
    const d = Math.hypot(B.x-A.x, B.y-A.y) / Math.max(1,W);
    const u = Math.max(0, Math.min(1, (d-0.10)/0.12));
    gate = u*u*(3-2*u); hadHands = true;
  }
  if (!(alive >= 0)) alive = 0;
  alive += (gate-alive) * Math.min(1, dt*(gate>alive?14:8));
  if (!fresh && hadHands && alive < 0.05) {
    worldIdx = (worldIdx+1) % WORLDS.length; applyWorld();
    hadHands = false; A = B = null;
    fA = { x:OneEuro(), y:OneEuro() }; fB = { x:OneEuro(), y:OneEuro() };
  }
  for (const s of sparks){ s.life -= dt*1.8; s.x += s.vx*dt*60; s.y += s.vy*dt*60; }
  sparks = sparks.filter(s=>s.life>0);
}

const radCache = {};
function radial(hex){
  if (radCache[hex]) return radCache[hex];
  const c = document.createElement('canvas'); c.width=c.height=128;
  const cc = c.getContext('2d');
  const g = cc.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,`rgba(${hex},1)`); g.addColorStop(0.4,`rgba(${hex},0.45)`); g.addColorStop(1,`rgba(${hex},0)`);
  cc.fillStyle=g; cc.fillRect(0,0,128,128);
  return radCache[hex]=c;
}

const SLICES = 48;
function drawRibbon(){
  if (alive < 0.02 || !A || !B) return;
  const w = WORLDS[worldIdx];
  const dx=B.x-A.x, dy=B.y-A.y;
  const len = Math.max(Math.hypot(dx,dy), 60*DPR);
  const ang = Math.atan2(dy,dx);
  const maxH = Math.min(Math.max(len*0.42, 90*DPR), H*0.42);
  const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
  const sw = len/SLICES;
  const top=[], bot=[], cs=[];
  for (let i=0;i<=SLICES;i++){
    const c = Math.cos(lerpA(rollA, rollB, i/SLICES));
    const hh = Math.abs(c)*maxH/2;
    cs.push(c);
    const x = -len/2 + i*sw;
    top.push({x, y:-hh}); bot.push({x, y:hh});
  }
  // --- ô cửa: nội dung giữ nguyên hệ trục màn hình, dải chỉ xén ---
  ctx.save();
  ctx.translate(mx,my); ctx.rotate(ang);
  ctx.beginPath();
  for (let i=0;i<=SLICES;i++) i?ctx.lineTo(top[i].x,top[i].y):ctx.moveTo(top[0].x,top[0].y);
  for (let i=SLICES;i>=0;i--) ctx.lineTo(bot[i].x,bot[i].y);
  ctx.closePath(); ctx.clip();
  ctx.save(); ctx.rotate(-ang); ctx.translate(-mx,-my);
  ctx.globalAlpha = alive;
  ctx.drawImage(glc, 0, 0, W, H);
  ctx.restore();
  let i0=0;
  while (i0 < SLICES){
    let i1=i0; while (i1<SLICES && (cs[i1]<0)===(cs[i0]<0)) i1++;
    if (cs[i0]<0){ ctx.globalAlpha = alive*0.45; ctx.fillStyle='#000';
      ctx.fillRect(-len/2+i0*sw, -maxH, (i1-i0)*sw, maxH*2); }
    i0=i1;
  }
  ctx.globalAlpha=1; ctx.restore();
  // --- viền phát sáng ---
  ctx.save(); ctx.translate(mx,my); ctx.rotate(ang);
  ctx.globalCompositeOperation='lighter'; ctx.lineJoin='round'; ctx.lineCap='round';
  for (const [wd,al,col] of [[18*DPR,0.13,`rgba(${w.edge},1)`],[8*DPR,0.30,`rgba(${w.edge},1)`],
                             [3*DPR,0.62,`rgba(${w.edge},1)`],[1.5*DPR,0.95,'rgba(255,252,255,1)']]){
    ctx.globalAlpha = alive*al; ctx.lineWidth=wd; ctx.strokeStyle=col;
    for (const pts of [top,bot]){ ctx.beginPath();
      pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); }
  }
  for (let i=1;i<=SLICES;i++) if (cs[i-1]*cs[i] < 0){
    const gx=-len/2+i*sw, r=maxH*0.22;
    ctx.globalAlpha = alive*0.55; ctx.drawImage(radial(w.spark), gx-r, -r, r*2, r*2);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.restore();
  if (alive>0.5 && Math.random()<0.5) for (const e of [A,B]){
    const a=Math.random()*6.283, v=0.6+Math.random()*1.6;
    sparks.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1});
  }
}

// ===================== Lớp thế giới (GL) =====================
// ma trận: uv màn hình -> uv ảnh mặt nạ, dựng từ tư thế đầu THẬT
function faceMatrix(){
  if (!head) return null;
  const { cx, cy, ex, ey, r00, r01, r10, r11 } = head;
  const a = r00*ex, b = r10*ex, c = r01*ey, d = r11*ey;
  const det = a*d - b*c;
  if (!isFinite(det) || Math.abs(det) < 1e-6) return null;
  const ia = d/det, ib = -b/det, ic = -c/det, id = a/det;
  return new Float32Array([ ia, ib, 0,  ic, id, 0,
    0.5 - (ia*cx + ic*cy), 0.5 - (ib*cx + id*cy), 1 ]);
}

function renderWorld(){
  if (!VW) return;
  if (glc.width !== VW || glc.height !== VH) { glc.width = VW; glc.height = VH; }
  gl.viewport(0,0,VW,VH);
  gl.useProgram(prog); gl.bindVertexArray(vao);
  pushTex(0, texCam, video);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, maskTex || blank1);
  const m = faceMatrix();
  gl.uniform1f(uni.faceOn, m ? 1 : 0);
  if (m) gl.uniformMatrix3fv(uni.faceM, false, m);
  const va = VW/VH, Z = 0.72;   // zoom nền để không lộ viền khung tranh
  gl.uniform2f(uni.bgFit, (va > bgAspect ? 1 : bgAspect/va)*Z, (va > bgAspect ? va/bgAspect : 1)*Z);
  // neo mạng nhện vào thân người: dưới mặt một quãng, cỡ suy từ khoảng cách mắt
  if (head) gl.uniform3f(uni.body, head.cx, head.cy + head.ey*0.95, head.ex*2.6);
  else      gl.uniform3f(uni.body, 0.5, 0.62, 0.45);
  gl.uniform1f(uni.time, tSec);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ===================== Vòng chạy =====================
let last = performance.now(), tsCounter = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (!ready || video.readyState < 2) return;
  if (!VW) { VW = video.videoWidth; VH = video.videoHeight; }
  if (!VW) return;

  const src = modelInput();
  const ts = ++tsCounter;
  try {
    readHands(hand.detectForVideo(src, ts));
    // mặt + tách người chỉ chạy khi dải đang mở -> tiết kiệm khi không dùng
    if (alive > 0.02 || hands.length >= 2) {
      const fr = faceLm.detectForVideo(src, ts);
      const Mx = fr.facialTransformationMatrixes && fr.facialTransformationMatrixes[0];
      const lm = fr.faceLandmarks && fr.faceLandmarks[0];
      if (Mx && lm) {
        const d = Mx.data;                             // cột-chính 4x4
        const eL = lm[33], eR = lm[263];
        const cx = 1 - (eL.x+eR.x)/2, cy = (eL.y+eR.y)/2 - 0.03;
        const span = Math.hypot(eR.x-eL.x, eR.y-eL.y);
        const s = Math.max(0.02, span*3.5);
        head = { cx, cy, ex:s, ey:s*(VW/VH), r00:d[0], r01:-d[4], r10:-d[1], r11:d[5] };
      } else head = null;
      seg.segmentForVideo(src, ts, r => {
        const mk = r.confidenceMasks && r.confidenceMasks[0];
        if (mk) maskTex = mk.getAsWebGLTexture();
      });
    }
  } catch(e){ /* một khung lỗi thì bỏ qua, không giết vòng chạy */ }

  updateRibbon(dt);
  if (alive > 0.02) renderWorld();

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  const s = Math.max(W/VW, H/VH), dw = VW*s, dh = VH*s;
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
  ctx.drawImage(video, (W-dw)/2, (H-dh)/2, dw, dh);
  ctx.restore();

  drawRibbon();

  const w = WORLDS[worldIdx];
  ctx.globalCompositeOperation='lighter';
  for (const sp of sparks){ ctx.globalAlpha = sp.life*alive; const r = 7*DPR*sp.life;
    ctx.drawImage(radial(w.spark), sp.x-r, sp.y-r, r*2, r*2); }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

// ===================== Khởi động =====================
(async () => {
  try {
    if (!gl) { say('Máy/trình duyệt không hỗ trợ WebGL2'); return; }
    say('đang nạp mô hình…');
    applyWorld();
    await initModels();
    say('đang xin quyền camera…');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width:{ideal:960}, height:{ideal:720}, facingMode:'user' }, audio:false });
    video.srcObject = stream;
    await video.play();
    VW = video.videoWidth; VH = video.videoHeight;
    say('');
    requestAnimationFrame(frame);
  } catch(e) {
    say('Lỗi: ' + (e && e.message ? e.message : e));
    console.error(e);
  }
})();
addEventListener('click', () => { worldIdx = (worldIdx+1) % WORLDS.length; applyWorld(); });
</script>
