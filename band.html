<!DOCTYPE html>
<html lang="vi">

  #msg { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
         color:#cfe3ff; font:14px -apple-system,sans-serif; text-align:center;

<body>
<div id="stage">

  <canvas id="gl"></canvas>

  <div id="msg">đang nạp…</div>
</div>

<!-- tasks-vision 1.0.1: bản IIFE, chạy bằng thẻ script thường, phơi global `Vision` -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.js"></script>
<script>
const video = document.getElementById('video');
const glc   = document.getElementById('gl');
const view  = document.getElementById('view');
const ctx   = view.getContext('2d');
const msg   = document.getElementById('msg');
const say   = t => { msg.textContent = t; msg.style.display = t ? '' : 'none'; };

const DPR = Math.min(devicePixelRatio, 1.25);
let W = 0, H = 0, VW = 0, VH = 0;
function resize() {
  W = view.width  = Math.round(innerWidth  * DPR);
  H = view.height = Math.round(innerHeight * DPR);
  updateFit();
}
addEventListener('resize', resize); resize();

// Camera hiển thị theo kiểu "cover" (phủ kín W×H, cắt bớt phần thừa) — xem chỗ vẽ nền trong
// frame(). BUG THẬT bị audit bắt được: mọi chỗ đổi toạ độ landmark (tay/mặt) và cả nội dung
// vẽ trong dải trước giờ dùng thẳng `(1-x)*W, y*H` — coi như camera được KÉO DÃN full W×H,
// không phải "cover". Trên máy tỉ lệ camera gần đúng tỉ lệ màn hình (laptop test suốt session
// này) 2 công thức gần như trùng nhau nên không lộ ra; trên ĐIỆN THOẠI DỌC (camera 16:9 ngang,
// màn hình rất dọc) 2 công thức lệch cực xa — cover-fit phải zoom+cắt sâu để phủ kín màn dọc,
// nên chỉ ~26% chiều ngang khung camera thật sự hiển thị được, mà công thức cũ vẫn map như thể
// toàn bộ camera trải đều hết W → tay/mặt lệch khỏi đúng vị trí trên màn hình rất xa, dải/nội
// dung trong dải bị bóp méo khác hẳn nền. fitS/fitDW/fitDH/fitOX/fitOY tính LẠI y hệt công thức
// "cover" nền đang dùng — MỌI chỗ đổi landmark + MỌI chỗ vẽ glc phải đi qua đúng bộ số này.
let fitS = 1, fitDW = 0, fitDH = 0, fitOX = 0, fitOY = 0;
function updateFit(){
  if (!VW || !VH || !W || !H) return;
  fitS = Math.max(W/VW, H/VH);
  fitDW = VW*fitS; fitDH = VH*fitS;
  fitOX = (W-fitDW)/2; fitOY = (H-fitDH)/2;
}

// ===================== Thế giới =====================
// Bỏ hẳn "mặc đồ nhân vật" — mask/costume dán rời luôn lệch theo cử động thật (Leon chê).
// Tạm thời: chỉ đổi NỀN + viền sáng bám mép người (lấy trực tiếp từ mask nên không
// bao giờ lệch, vì không phải tài sản dán rời). Đang chờ Leon chốt hướng khác.
// violet/gold trước dùng CHUNG 1 ảnh bg_void.jpg (chỉ khác tint) -- Leon chê "concept không rõ
// là gì", giờ mỗi world 1 ảnh riêng, cùng art-style comic với ember cho đồng bộ.
// Mỗi world giờ có 2 bản ảnh: bgP (dọc 9:16, cho điện thoại) và bgL (ngang 16:9, cho laptop) —
// Leon báo ảnh dọc bị camera laptop (ngang) ép "kéo nhoè dàn ngang" vì lệch tỉ lệ quá xa so
// với khung camera thật (fit trong shader là kiểu "cover" nên KHÔNG méo hình, nhưng lệch tỉ lệ
// quá xa thì phải zoom-crop rất sâu, nhìn giống bị nhoè/kéo dãn). pickBgPath() chọn bản đúng
// theo tỉ lệ camera THẬT (VW/VH — chính là "va" dùng trong công thức fit, không phải kích
// thước cửa sổ trình duyệt, vì đó mới là cái quyết định độ crop-zoom thật sự).
const WORLDS = [
  { id:'ember',  bgP:'assets/bg_city.jpg',         bgL:'assets/bg_city_land.jpg',
    tint:[1.00,0.55,0.30], edge:'255,190,130', spark:'255,205,150' },
  { id:'violet', bgP:'assets/bg_violet_temple.jpg', bgL:'assets/bg_violet_temple_land.jpg',
    tint:[0.62,0.35,0.98], edge:'210,165,255', spark:'215,175,255' },
  { id:'gold',   bgP:'assets/bg_gold_desert.jpg',   bgL:'assets/bg_gold_desert_land.jpg',
    tint:[1.00,0.75,0.25], edge:'255,220,160', spark:'255,225,170' },
];
let worldIdx = 0;

// ===================== WebGL: lớp "thế giới bên kia" — pipeline 6 pass =====================
// Vá theo 5 điểm nghiên cứu chỉ ra (feedback trail, domain-warp, palette IQ, dịch
// chuyển theo độ sáng kiểu Rutt-Etra, bloom+CA+vignette+grain). Fresh -> Feedback ->
// Bright-pass -> Blur ngang -> Blur dọc -> Present (present mới thật sự vẽ ra canvas).
const gl = glc.getContext('webgl2', { antialias:false, alpha:false, premultipliedAlpha:false });
// Audit bắt được: check "!gl" cũ nằm trong IIFE khởi động ở cuối file -- nhưng NGAY DƯỚI đây
// là hàng loạt gl.createShader/gl.createProgram() chạy ở TOP-LEVEL (không phải trong hàm nào),
// nên nếu gl null thì SCRIPT VỠ Ở ĐÂY trước khi bao giờ chạy tới IIFE -> check cũ là dead code,
// máy không hỗ trợ WebGL2 sẽ kẹt mãi ở "đang nạp…" không có thông báo lỗi gì. Check NGAY tại đây.
if (!gl) { say('Máy/trình duyệt không hỗ trợ WebGL2'); throw new Error('WebGL2 không khả dụng'); }
// Audit bắt được: mất ngữ cảnh GL (điện thoại thu hồi bộ nhớ GPU lúc app bị đưa xuống nền —
// rất hay gặp trên di động, hiếm trên laptop nên chưa từng lộ ra khi test session này) trước
// giờ không có xử lý gì -- cả 3 model MediaPipe DÙNG CHUNG context này (canvas: glc) nên mất
// là mất sạch, màn hình đứng hình vĩnh viễn không có tín hiệu gì. Ít nhất báo cho biết.
glc.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  ready = false;
  say('Mất ngữ cảnh đồ hoạ (thường do đổi app/khoá máy) — tải lại trang');
});

const VS = `#version 300 es
in vec2 p; out vec2 v;
void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }

// --- BEAUTY: làm mịn da nhẹ kiểu edge-aware (giữ biên mắt/tóc/viền sắc, chỉ mịn vùng da
// phẳng màu) trên camera THẬT, trước khi dùng cho MỌI nơi hiển thị (trong dải lẫn ngoài
// dải). Là bộ lọc ảnh thuần (input=output cùng hệ toạ độ, KHÔNG tự mirror) — mirror vẫn
// do các pass sau (FRESH, BLIT) tự lo như cũ, tránh lệch hệ toạ độ giữa cam và mask.
const FS_BEAUTY = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uSrc;
uniform vec2 uPixel;
void main(){
  // Audit bắt được: 3x3 (9 tap, chạy trên TOÀN BỘ độ phân giải camera mỗi khung, kể cả lúc
  // dải đóng) -- 4 tap chéo góc đóng góp ít (xa tâm hơn hẳn 4 tap cạnh) mà tốn ngang 4 tap
  // cạnh. Bỏ 4 góc, còn lại tap tâm (d=0 nên w=exp(0)=1 CHẮC CHẮN, khỏi tính lại) + 4 cạnh —
  // 9 tap còn 5, ảnh hưởng hình gần như không thấy được ở mức làm mịn nhẹ này.
  vec3 c0 = texture(uSrc, v).rgb;
  vec3 sum = c0; float wsum = 1.0;
  vec2 offs[4] = vec2[4](vec2(1.0,0.0), vec2(-1.0,0.0), vec2(0.0,1.0), vec2(0.0,-1.0));
  for (int i=0; i<4; i++){
    vec2 off = offs[i] * uPixel * 2.2;
    vec3 c = texture(uSrc, v+off).rgb;
    float d = length(c - c0);
    float w = exp(-d*d / 0.018);          // càng khác màu càng ít đóng góp -> giữ biên
    sum += c * w; wsum += w;
  }
  vec3 smoothed = sum / max(wsum, 1e-4);
  vec3 col = mix(c0, smoothed, 0.55);        // hoà 1 phần với gốc, tránh trông "nhựa"
  col = col * 1.035 + vec3(0.010, 0.004, 0.0);   // sáng nhẹ + ấm nhẹ, tông da hồng hào hơn
  col = clamp((col - 0.5) * 1.03 + 0.5, 0.0, 1.0);
  o = vec4(col, 1.0);
}`;

// --- BLIT: hiện camera đã beauty khi dải ĐÓNG (không qua pipeline 6-pass) — tự mirror y
// hệt FS_FRESH để nhất quán, để Canvas2D luôn lấy nội dung "đã mirror đúng" từ glc.
const FS_BLIT = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uSrc;
void main(){
  o = texture(uSrc, vec2(1.0 - v.x, 1.0 - v.y));
}`;

function compileProgram(fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
function locs(prog, names){ const o={}; for (const n of names) o[n]=gl.getUniformLocation(prog,n); return o; }

// --- Pass 1 "FRESH": người + nền của khung NÀY, chưa có vệt (đưa vào feedback ở pass 2) ---
// Đ2 domain-warp (thay sin thô), Đ3 bảng màu cosine IQ (thay mix thẳng), Đ4 dịch UV theo
// gradient độ sáng (cơ chế thật của Rutt-Etra — độ sáng đẩy LỆCH hình chứ không tô màu đè).
const FS_FRESH = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uCam, uMask, uBg;
uniform vec2  uBgFit;
uniform vec2  uPixel;
uniform vec3  uTint;
uniform float uTime;
uniform float uTurb;      // kênh handSpeed -> độ nhiễu loạn của domain-warp (KHÔNG set thẳng, chỉ nhiễu thêm)

float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
// Audit bắt được: pass này chạy TOÀN BỘ độ phân giải camera MỖI khung, và hash() cũ dùng
// sin() (hàm siêu việt, GPU di động không có đơn vị tăng tốc cho sin/cos như desktop, tính
// chậm hơn hẳn) gọi lặp lại hàng chục lần/pixel qua fbm/noise/warp. Đổi sang hash kiểu
// "multiply-fract" (Dave Hoskins) — chỉ nhân/cộng/fract, không sin — cùng chất lượng nhiễu
// cho mục đích này (không cần phân bố ngẫu nhiên hoàn hảo, chỉ cần "trông ngẫu nhiên").
float hash(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
// 4 tầng -> 2 tầng: tầng 3-4 đóng góp biên độ rất nhỏ (0.125+0.0625 trên tổng ~0.9375) ở tần
// số cao gần như không thấy được qua bloom+chromatic-aberration+grain của pass PRESENT sau
// cùng -- cắt còn 2 tầng giảm đúng nửa số lần gọi noise()/hash() mà mắt khó phân biệt được.
float fbm(vec2 p){
  float val=0.0, amp=0.5;
  for (int i=0;i<2;i++){ val += amp*noise(p); p *= 2.02; amp *= 0.5; }
  return val;
}
// domain warp kiểu Inigo Quilez f(p + h(p)) -> hoạ tiết "thở" thay vì tuần hoàn máy móc.
// turb (0..~2, từ kênh handSpeed) CỘNG THÊM vào biên độ nền — tay càng động, hệ càng
// turbulence hơn; đứng yên thì về mức thở nhẹ mặc định, không bao giờ phẳng lì.
vec2 warp(vec2 p, float t, float turb){
  vec2 q = vec2(fbm(p + t*0.05), fbm(p + vec2(5.2,1.3) - t*0.04));
  return p + (0.22 + 0.30*turb)*(q - 0.5);
}
// bảng màu cosine IQ: không bao giờ xám giữa chừng như mix() tuyến tính
vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d){ return a + b*cos(6.28318*(c*t+d)); }

void main(){
  vec2 uv = vec2(1.0 - v.x, 1.0 - v.y);            // soi gương + lật dọc cho khớp video

  // dịch UV theo gradient độ sáng cục bộ — cơ chế Rutt-Etra thật, không phải phủ màu đè
  float cL = luma(texture(uCam, uv).rgb);
  vec2 gradL = vec2(
    luma(texture(uCam, uv+vec2(uPixel.x,0.0)).rgb) - luma(texture(uCam, uv-vec2(uPixel.x,0.0)).rgb),
    luma(texture(uCam, uv+vec2(0.0,uPixel.y)).rgb) - luma(texture(uCam, uv-vec2(0.0,uPixel.y)).rgb));
  vec2 dispUv = uv + gradL * 0.018;
  vec3 cam   = texture(uCam, dispUv).rgb;
  float mask = texture(uMask, dispUv).r;
  float personA = smoothstep(0.35, 0.65, mask);

  // mép người (đo tại uv gốc cho silhouette ổn định) + dòng chảy domain-warp thật
  vec2 px = uPixel * 3.0;
  float mL = texture(uMask, uv - vec2(px.x,0.0)).r, mR = texture(uMask, uv + vec2(px.x,0.0)).r;
  float mT = texture(uMask, uv - vec2(0.0,px.y)).r, mB = texture(uMask, uv + vec2(0.0,px.y)).r;
  float edge = smoothstep(0.20, 0.55, abs(mL-mR) + abs(mT-mB));
  float flow = 0.5 + 0.5*fbm(warp(uv*6.0, uTime, uTurb) + uTime*0.15);

  // --- "tóc bốc cháy" kiểu Super Saiyan/Naruto (Leon xin thêm) — không có mask tóc riêng
  // (segmentation chỉ tách được "người" chung), nên xấp xỉ: mạnh dần khi CÀNG GẦN ĐỈNH khung
  // (đầu luôn ở trên trong khung webcam bình thường) + noise RIÊNG cuộn NGƯỢC LÊN theo thời
  // gian (lửa/khói thật luôn cuộn lên, khác domain-warp nền vốn không có hướng ưu tiên) +
  // rung nhanh (lửa thật nhấp nháy nhanh, không "thở" chậm như flow nền) + lõi thiên trắng
  // pha ngoài rìa màu world-tint (lửa thật: lõi trắng nóng nhất, rìa mới có màu).
  // Bản đầu chỉ nhân vào edge (viền mỏng bám sát mép) -> nhìn như viền sáng hơi ấm, không
  // ra dáng "tém lửa" thật. Sửa: dò dọc THEO HƯỚNG XUỐNG (tìm "người" ở dưới, vì tém lửa mọc
  // LÊN từ đầu) một quãng ngoài silhouette, lệch ngang theo noise cho tém không thẳng cứng —
  // pixel NGOÀI người (trên đỉnh đầu) vẫn bắt được lửa nếu gần người phía dưới.
  float headBias = 1.0 - smoothstep(0.02, 0.68, uv.y);      // 1 ở đỉnh khung, tắt dần xuống ngực
  vec2 flameUv = uv - vec2(0.0, uTime*0.22);                // cuộn LÊN, không cuộn ngang như warp() nền
  float flameNoise = fbm(warp(flameUv*5.0, uTime*1.6, uTurb*1.4 + 0.4));
  float flameFlicker = 0.5 + 0.5*sin(uTime*9.0 + flameNoise*8.0);
  // Leon báo lag trên điện thoại -- 5 tap thay vì 7 (mỗi tap là 1 lần đọc texture uMask/pixel,
  // chạy trên TOÀN BỘ độ phân giải pass FRESH mỗi khung) vẫn đủ mượt cho hiệu ứng tém lửa,
  // giảm ~30% chi phí vòng dò này mà không đổi hình dạng/độ mạnh tổng thể (đã bù bằng cách
  // tăng bước nhảy mỗi tap, giữ nguyên tầm với ~10% chiều cao khung).
  float flameReach = 0.0;
  for (int fi = 1; fi <= 5; fi++) {
    float ft = float(fi) / 5.0;
    float sway = (flameNoise - 0.5) * 0.06 * ft;
    vec2 samplePos = uv + vec2(sway, ft * 0.10);              // +y = xuống dưới = về phía người thật
    float m = texture(uMask, samplePos).r;
    flameReach = max(flameReach, smoothstep(0.3, 0.6, m) * (1.0 - ft));
  }
  float flame = max(edge, flameReach) * headBias * flameNoise * (0.5 + 0.5*flameFlicker);
  vec3 flameCol = mix(uTint, mix(vec3(1.0,0.85,0.4), vec3(1.0), flameFlicker), 0.5 + 0.4*flameNoise);

  // --- nền: Ken Burns + xoáy năng lượng bằng domain-warp thật (không sin/cos thô) ---
  float zoom = 1.0 + 0.05*sin(uTime*0.11);
  vec2 pan = vec2(sin(uTime*0.07), cos(uTime*0.05)) * 0.02;
  vec2 buv = (uv - 0.5 + pan) * uBgFit * zoom + 0.5;
  vec3 bg = texture(uBg, vec2(buv.x, 1.0 - buv.y)).rgb;
  bg *= 0.55 + 0.45 * smoothstep(1.0, 0.0, length(uv-0.5));
  bg += uTint * (fbm(warp(uv*3.0, uTime*0.6, uTurb)) - 0.5) * 0.16;

  // --- người: bảng màu cosine IQ theo độ sáng+dòng chảy+thời gian, không mix() thẳng ---
  float t = cL*0.65 + flow*0.25 + uTime*0.015;
  vec3 person = palette(t, uTint*0.18, mix(uTint, vec3(1.0), 0.55)*0.55, vec3(1.0), uTint*0.22);
  person *= 0.86 + 0.14*sin(uv.y*760.0 - uTime*7.0);           // dòng quét ngang kiểu hologram
  person += uTint * edge * flow * 1.4;                         // viền trong rực theo dòng chảy
  person += flameCol * flame * 4.0;                            // lửa tóc: lõi thiên trắng, rực hơn hẳn viền thường
  person = mix(cam*0.16 + person*0.84, person, 0.85);          // chừa chút bóng thật cho có khối

  vec3 col = mix(bg, person, personA);
  col += uTint * edge * flow * 0.9;                            // hào quang tràn ra ngoài silhouette
  col += flameCol * flame * 3.2;                               // lửa tóc tràn ra ngoài silhouette, mạnh hơn hào quang thường

  o = vec4(col, 1.0);
}`;

// --- Pass 2 "COMBINE": ping-pong feedback — Đ1, đòn bẩy lớn nhất trong 5 cái ---
// prev*decay TRỪ một sàn nhỏ (không thì mờ dần thành sương xám) rồi max với khung mới.
const FS_COMBINE = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uPrev, uFresh;
uniform float uDecay;
uniform vec2  uDrift;
uniform float uZoom;
uniform float uKick;      // kênh handAccel -> hệ "giật" mạnh hơn khi tay tăng tốc đột ngột
void main(){
  vec2 uv = (v - 0.5) * uZoom + 0.5 + uDrift;
  vec3 prev  = texture(uPrev, uv).rgb;
  vec3 fresh = texture(uFresh, v).rgb;
  vec3 trail = max(prev*uDecay - 0.02, 0.0);
  o = vec4(max(trail, fresh*(1.0 + uKick*0.9)), 1.0);
}`;

// --- Pass 3 "BRIGHT": trích vùng sáng cho bloom (Đ5) ---
const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uScene;
void main(){
  vec3 c = texture(uScene, v).rgb;
  float l = dot(c, vec3(0.299,0.587,0.114));
  o = vec4(c * smoothstep(0.55, 0.9, l), 1.0);
}`;

// --- Pass 4/5 "BLUR": Gaussian 5-tap tách trục, dùng chung cho ngang rồi dọc ---
const FS_BLUR = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uTex;
uniform vec2 uTexel, uDir;
void main(){
  vec3 sum = texture(uTex, v).rgb * 0.2270270270;
  vec2 off1 = uDir * uTexel * 1.3846153846, off2 = uDir * uTexel * 3.2307692308;
  sum += texture(uTex, v+off1).rgb * 0.3162162162; sum += texture(uTex, v-off1).rgb * 0.3162162162;
  sum += texture(uTex, v+off2).rgb * 0.0702702703; sum += texture(uTex, v-off2).rgb * 0.0702702703;
  o = vec4(sum, 1.0);
}`;

// --- Pass 6 "PRESENT": hợp bloom + chromatic aberration + vignette + grain có ngưỡng độ sáng (Đ5) ---
// Pass DUY NHẤT vẽ ra chính canvas glc (framebuffer null) — mấy pass trên đều ra FBO offscreen.
const FS_PRESENT = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uScene, uBloom;
uniform float uTime;
float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3,289.1)))*43758.5453); }
void main(){
  vec2 dir = v - 0.5;
  vec3 col = vec3(
    texture(uScene, v + dir*0.0035).r,
    texture(uScene, v).g,
    texture(uScene, v - dir*0.0035).b);
  col += texture(uBloom, v).rgb * 0.55;
  float vig = smoothstep(0.95, 0.35, length(dir));
  col *= mix(0.62, 1.0, vig);
  float l = dot(col, vec3(0.299,0.587,0.114));
  float g = hash(v*800.0 + uTime) - 0.5;
  col += g * 0.035 * mix(1.0, 0.3, smoothstep(0.05,0.5,l));    // grain có ngưỡng: xám phẳng đọc là filter, gated đọc là film
  o = vec4(col, 1.0);
}`;

function createFBO(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fb, tex, w, h };
}
function resizeFBO(o, w, h){
  gl.bindTexture(gl.TEXTURE_2D, o.tex);

  if (!trail[0]) return;

    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.viewport(0,0,t.w,t.h);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);

}
function ensurePipeline(w, h){
  if (pipeW === w && pipeH === h && fboFresh) return;
  pipeW = w; pipeH = h;
  const bw = Math.max(2, w>>2), bh = Math.max(2, h>>2);
  if (!fboFresh) {
    fboFresh = createFBO(w,h); fboBeauty = createFBO(w,h);
    trail = [createFBO(w,h), createFBO(w,h)];
    bloomBright = createFBO(bw,bh); bloomBlurA = createFBO(bw,bh); bloomBlurB = createFBO(bw,bh);
  } else {
    resizeFBO(fboFresh, w, h); resizeFBO(fboBeauty, w, h); resizeFBO(trail[0], w, h); resizeFBO(trail[1], w, h);
    resizeFBO(bloomBright, bw, bh); resizeFBO(bloomBlurA, bw, bh); resizeFBO(bloomBlurB, bw, bh);

}

// ---- One Euro Filter: chuẩn khử rung landmark trong AR ----
function OneEuro(minCut=1.2, beta=0.5, dCut=1.0){
  let xPrev=null, dxPrev=0, tPrev=null;
  const a = (cut, dt) => { const r = 2*Math.PI*cut*dt; return r/(r+1); };
  return (x, t) => {
    if (xPrev === null || !isFinite(xPrev)) { xPrev = x; tPrev = t; return x; }
    const dt = Math.max(1e-3, t - tPrev); tPrev = t;
    const dx = (x - xPrev)/dt;
    dxPrev = dxPrev + a(dCut, dt)*(dx - dxPrev);
    xPrev = xPrev + a(minCut + beta*Math.abs(dxPrev), dt)*(x - xPrev);
    return xPrev;
  };
}

// NGÓN + chiều sâu) =====================
// A/B (grip 65/35) ở TRÊN vẫn giữ nguyên, chỉ dùng để lái state machine mở/đóng/chắp tay —
// KHÔNG đụng vào, vì đã đo+vá kỹ qua nhiều vòng (mông lung, phát hiện đôi giả, deadlock chắp
// tay...). Bộ 4 điểm dưới đây là lớp RIÊNG chỉ phục vụ HÌNH DÁNG dải, đọc thêm dữ liệu ngón
// cái/ngón trỏ THẬT của MediaPipe (readHands() đã tính sẵn thumbPx/indexPx cho mỗi tay, trước
// giờ chỉ dùng để vẽ debug dots) — không phải bịa thêm điểm ảo.
//
// Chiều sâu: MediaPipe trả z cho mỗi landmark, nhưng z đó lấy GỐC LÀ CỔ TAY CỦA CHÍNH BÀN TAY
// ĐÓ (mỗi tay một hệ quy chiếu riêng) — đo thật trên video ref xác nhận: wristZ luôn ~0 cho cả
// 2 tay (nhiễu float, không phải tín hiệu), nên KHÔNG so sánh được z giữa tay này với tay kia
// để biết tay nào gần camera hơn — dùng thẳng z là sai. Thay vào đó dùng ĐỘ LỚN BIỂU KIẾN của
// bàn tay trên khung hình (hl = khoảng cổ tay-đến-gốc-ngón-giữa, tính ra PIXEL thật chứ không
// chuẩn hoá) làm tín hiệu chiều sâu: tay gần camera hơn thì TRÔNG TO HƠN trên khung — đúng
// nguyên lý phối cảnh mắt người dùng thật, và đã có sẵn hl trong readHands(). Đo trên video
// ref: kích thước tay dao động 16-74px (trung bình 45px), 2 tay cùng khung có thể lệch nhau
// tới 110% so với trung bình — đủ biên độ để phối cảnh nhìn thấy được, không phải áp đặt.
function mkPt(){ return { pos:null, raw:null, vel:{x:0,y:0}, fx:OneEuro(2.2,0.9,1.0), fy:OneEuro(2.2,0.9,1.0) }; }
function trackPoint(pt, target, isNew, dt, dtReal, tSecNow){
  if (!pt.pos && target) { pt.pos = {...target}; pt.raw = {...target}; }
  if (!pt.raw) return;
  if (isNew) {
    if (target) { pt.vel = { x:(target.x-pt.raw.x)/dtReal, y:(target.y-pt.raw.y)/dtReal }; pt.raw = {...target}; }
  } else {
    pt.raw.x += pt.vel.x*dt; pt.raw.y += pt.vel.y*dt; pt.vel.x *= 0.90; pt.vel.y *= 0.90;
  }
  pt.pos = { x: pt.fx(pt.raw.x, tSecNow), y: pt.fy(pt.raw.y, tSecNow) };
}
function resetPt(pt){ pt.pos=null; pt.raw=null; pt.vel={x:0,y:0}; pt.fx=OneEuro(2.2,0.9,1.0); pt.fy=OneEuro(2.2,0.9,1.0); }
let AthumbPt = mkPt(), AindexPt = mkPt(), BthumbPt = mkPt(), BindexPt = mkPt();
let AsizeVal = 45, BsizeVal = 45;   // px biểu kiến, khởi tạo = trung bình đo được
const AsizeF = OneEuro(1.2, 0.7, 1.0), BsizeF = OneEuro(1.2, 0.7, 1.0);
// "vải mềm": lệch vuông góc trục dài, dao động sống ngay cả lúc đứng yên (không bao giờ phẳng
// lì, cùng triết lý với `turb` nền) + biên độ tăng theo tốc độ tay CH.handSpeed thật.
let membraneSway = 0;

// ===================== Kênh (channel, kiểu CHOP của TouchDesigner) =====================
// Mọi tín hiệu sống đi qua đây thành "kênh" độc lập có tên, thay vì gắn cứng
// 1 landmark -> 1 hiệu ứng. Hiệu ứng mới chỉ cần ĐỌC kênh có sẵn; đổi nguồn (sau này
// nối audio chẳng hạn) chỉ cần đổi chỗ GHI kênh, chỗ đọc không đụng gì.
const CH = {
  time: 0,
  ribbonOpen: 0,     // = alive, 0..1
  ribbonLen: 0,      // độ dài dải hiện tại (px), 0 khi đóng
  handSpeed: 0,      // tốc độ tay đã lọc mượt, vô đơn vị (chuẩn hoá theo bề rộng màn hình)
  handAccel: 0,      // độ giật tăng tốc tức thời — chỉ dương, dùng cho hiệu ứng "kick"
  pinchOpen: 1,       // độ nhúm cái-trỏ TRUNG BÌNH 2 tay, đã lọc mượt — 1 = mức trung tính
};
const chLag = { handSpeed: OneEuro(0.8, 0.9, 1.0), pinch: OneEuro(1.5, 0.6, 1.0) };   // lọc riêng từng kênh, tách khỏi lọc vị trí của fA/fB
let chPrevMid = null, chPrevSpeed = 0;
function updateChannels(dt){
  CH.time = tSec;
  CH.ribbonOpen = alive;
  if (A && B) {
    CH.ribbonLen = Math.hypot(B.x-A.x, B.y-A.y);
    const mid = { x:(A.x+B.x)/2, y:(A.y+B.y)/2 };
    // chia cho fitDW (không phải W) cùng lý do đã ghi ở gate/detectPalmsTogether -- tốc độ tay
    // không nên đổi theo tỉ lệ MÀN HÌNH, chỉ nên đổi theo chuyển động THẬT trong không gian camera.
    const raw = chPrevMid ? Math.hypot(mid.x-chPrevMid.x, mid.y-chPrevMid.y)/Math.max(dt,1e-3)/Math.max(fitDW,1) : 0;
    chPrevMid = mid;
    CH.handSpeed = chLag.handSpeed(raw, tSec);
    CH.handAccel = Math.max(0, CH.handSpeed - chPrevSpeed);   // chỉ bắt lúc TĂNG tốc, giảm tốc không kick
    chPrevSpeed = CH.handSpeed;
  } else {
    chPrevMid = null;
    CH.ribbonLen = 0; CH.handSpeed = chLag.handSpeed(0, tSec); CH.handAccel = 0;
  }
  if (hands.length) {
    const avgPinch = hands.reduce((s,h)=>s+h.pinchNorm, 0) / hands.length;
    CH.pinchOpen = chLag.pinch(avgPinch, tSec);
  }
}


// ---- Mặt nạ vẽ từ 478 điểm landmark THẬT (không dán ảnh/hoạ tiết rời — xem ghi chú ở
// initModels) -- cùng công thức mirror (1-x)*W, y*H như tay, để khớp hệ toạ độ với mọi thứ
// khác trên màn hình (dải, camera). facePx(i) trả về null nếu chưa có mặt.
function readFace(res){
  const L = res && res.faceLandmarks && res.faceLandmarks[0];
  faceLm = L || null;
}
function facePx(i){
  if (!faceLm || !faceLm[i]) return null;
  const lm = faceLm[i];
  return { x: fitOX + (1-lm.x)*fitDW, y: fitOY + lm.y*fitDH };
}

let handsFreshThisFrame = false;
function readHands(res){
  hands = [];
  handsFreshThisFrame = true;
  const L = (res && res.landmarks) || [];
  for (const lm of L){
    // trung điểm ngón cái + ngón trỏ (kiểu nhúm/pinch) — nhưng lọc ngón cái riêng trước
    // vì landmark 4 (đầu ngón cái) tự nó nhiễu hơn hẳn landmark 8 trong MediaPipe, dồn
    // hết vào midpoint không lọc là nguồn gốc cảm giác "mông lung" mà Leon báo.
    const thumbPx = { x: fitOX + (1-lm[4].x)*fitDW, y: fitOY + lm[4].y*fitDH };
    const indexPx = { x: fitOX + (1-lm[8].x)*fitDW, y: fitOY + lm[8].y*fitDH };
    // Đo trên khung ref thật: khi tay ở tư thế nắm hờ chỉ chỉa ngón trỏ (không cố tình
    // nhúm sát), ngón cái-trỏ có thể cách nhau tới 120px/1024 — trung điểm 50/50 rơi vào
    // KHOẢNG TRỐNG giữa 2 ngón, không nằm trên ngón nào cả (thấy rõ qua debug dots) ->
    // đây là nguồn gốc "mông lung". Nghiêng về ngón trỏ (ổn định, luôn đúng đầu ngón)
    // nhưng vẫn cộng thêm ngón cái để còn "cảm" được cả 2, không quay lại index trơ trọi.
    const tip = { x: lm[8].x*0.65 + lm[4].x*0.35, y: lm[8].y*0.65 + lm[4].y*0.35 };
    const hl = Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y) || 1e-6;
    const pw = Math.hypot(lm[5].x-lm[17].x, lm[5].y-lm[17].y);
    const c = Math.max(0, Math.min(1, (pw/hl)/0.95));
    const sign = ((lm[5].z || 0) - (lm[17].z || 0)) >= 0 ? 1 : -1;
    // độ nhúm cái-trỏ CHUẨN HOÁ theo chiều dài bàn tay -> không phụ thuộc khoảng cách tới
    // camera. Đo trên video ref: dao động 0.14 (nhúm chặt) .. 3.3 (xoè hết cỡ), p10=0.67 p90=2.28.
    const pinchNorm = Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y) / hl;
    hands.push({ grip:{ x: fitOX + (1-tip.x)*fitDW, y: fitOY + tip.y*fitDH }, thumbPx, indexPx, pinchNorm,
                 sizePx: hl*fitDW,   // độ lớn biểu kiến THẬT trên màn hình (không phải W thô) -- tín hiệu chiều sâu, xem ghi chú ở mkPt/trackPoint
                 roll: Math.acos(Math.max(-1, Math.min(1, c*sign))) });
  }
  twoHandStreak = hands.length >= 2 ? twoHandStreak + 1 : 0;
}

// ---- chấm debug: hiện ĐÚNG chỗ MediaPipe đang thấy ngón cái/ngón trỏ, để soi bằng mắt
// thay vì đoán. Xanh dương = ngón cái, hồng = ngón trỏ, vàng nhỏ = điểm nhúm thô (chưa lọc),
// vàng viền trắng to = điểm neo dải sau khi đã lọc mượt (A/B). Gỡ khi tracking đã ổn.
function drawDebugDots(){
  ctx.save();
  for (const h of hands) {
    ctx.beginPath(); ctx.arc(h.thumbPx.x, h.thumbPx.y, 7*DPR, 0, 7);
    ctx.fillStyle = 'rgba(70,150,255,0.9)'; ctx.fill();
    ctx.beginPath(); ctx.arc(h.indexPx.x, h.indexPx.y, 7*DPR, 0, 7);
    ctx.fillStyle = 'rgba(255,70,180,0.9)'; ctx.fill();
    const rawX = (h.thumbPx.x+h.indexPx.x)/2, rawY = (h.thumbPx.y+h.indexPx.y)/2;
    ctx.beginPath(); ctx.arc(rawX, rawY, 4*DPR, 0, 7);
    ctx.fillStyle = 'rgba(255,220,40,0.95)'; ctx.fill();
  }
  for (const p of [A, B]) {
    if (!p) continue;
    ctx.beginPath(); ctx.arc(p.x, p.y, 10*DPR, 0, 7);
    ctx.fillStyle = 'rgba(255,220,40,0.55)'; ctx.fill();
    ctx.lineWidth = 2*DPR; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
  }
  ctx.font = `${13*DPR}px -apple-system,sans-serif`; ctx.fillStyle = '#fff';
  ctx.fillText(`tay: ${hands.length}  xanh=cái  hồng=trỏ  vàng nhỏ=nhúm thô  vàng to=neo đã lọc`, 10*DPR, 24*DPR);
  ctx.restore();
}

function bindHands(){
  if (!hands.length) return null;
  // chỉ tin "2 tay" khi ổn định liên tục (xem giải thích ở khai báo twoHandStreak) — phát
  // hiện đôi loé 1-2 khung thì rơi xuống nhánh 1-tay, mà nhánh đó cần A/B đã tồn tại từ
  // trước mới làm gì được -> 1 tay giơ đơn độc từ trạng thái đóng không thể mở dải nữa.
  if (hands.length >= 2 && twoHandStreak >= TWO_HAND_STREAK_MIN) {
    const [p,q] = [...hands].sort((x,y)=>x.grip.x-y.grip.x);
    if (A && B) {
      const straight = Math.hypot(p.grip.x-A.x,p.grip.y-A.y)+Math.hypot(q.grip.x-B.x,q.grip.y-B.y);
      const swapped  = Math.hypot(q.grip.x-A.x,q.grip.y-A.y)+Math.hypot(p.grip.x-B.x,p.grip.y-B.y);
      return swapped < straight ? [q,p] : [p,q];
    }
    return [p,q];
  }
  const h = hands[0];
  if (!A || !B) return null;
  return Math.hypot(h.grip.x-A.x,h.grip.y-A.y) <= Math.hypot(h.grip.x-B.x,h.grip.y-B.y) ? [h,null] : [null,h];
}

function updateRibbon(dt){
  tSec += dt;
  const pair = bindHands();
  const isNew = handsFreshThisFrame; handsFreshThisFrame = false;
  // dtReal cần cho CẢ velocity A/B (gesture) LẪN 4 điểm ngón (hình dáng) -- tính 1 lần dùng
  // chung, đọc lastDetectT TRƯỚC khi nó được cập nhật bên dưới (giữ đúng nghĩa "thời gian thật
  // trôi qua kể từ lần detect trước", không phải khoảng cách tới khung hiện tại).
  const dtReal = Math.max(1/60, tSec - lastDetectT);
  let p = null, q = null;

  if (pair) {
    [p, q] = pair;
    if (!A && p) { A = {...p.grip}; rollA = p.roll; rawA = {...p.grip}; }
    if (!B && q) { B = {...q.grip}; rollB = q.roll; rawB = {...q.grip}; }
    // model tay chạy CHẬM hơn 60fps render (~14-20ms/lần) -> chỉ khi có detect MỚI mới
    // đo vận tốc thật; giữa các lần đó thì NGOẠI SUY theo vận tốc đó thay vì đứng yên rồi
    // nhảy — đây là nguồn gốc chính của cảm giác "chưa mượt/giật".
    if (isNew) {
      if (p && rawA) { velA = { x:(p.grip.x-rawA.x)/dtReal, y:(p.grip.y-rawA.y)/dtReal }; rawA = {...p.grip}; }
      if (q && rawB) { velB = { x:(q.grip.x-rawB.x)/dtReal, y:(q.grip.y-rawB.y)/dtReal }; rawB = {...q.grip}; }
      lastDetectT = tSec;
      if (p) AsizeVal = AsizeF(p.sizePx, tSec);
      if (q) BsizeVal = BsizeF(q.sizePx, tSec);
    }
    if (p && A) { rollA = lerpA(rollA, p.roll, Math.min(1, dt*8)); seenA = tSec; }
    if (q && B) { rollB = lerpA(rollB, q.roll, Math.min(1, dt*8)); seenB = tSec; }
  }
  // 4 điểm ngón thật cho HÌNH DÁNG dải (độc lập với A/B đang lái state machine mở/đóng) —
  // chạy trackPoint() MỖI khung kể cả lúc pair=null (p/q=null), để tiếp tục ngoại suy+lọc
  // trong lúc mất khung ngắn hạn, y hệt cách A/B tự chạy tiếp bên dưới.
  trackPoint(AthumbPt, p ? p.thumbPx : null, isNew, dt, dtReal, tSec);
  trackPoint(AindexPt, p ? p.indexPx : null, isNew, dt, dtReal, tSec);
  trackPoint(BthumbPt, q ? q.thumbPx : null, isNew, dt, dtReal, tSec);
  trackPoint(BindexPt, q ? q.indexPx : null, isNew, dt, dtReal, tSec);
  // ngoại suy vị trí RAW theo vận tốc MỖI khung (kể cả khung không có detect mới), rồi mới
  // đưa qua OneEuro để mượt nhiễu nhỏ -> chuyển động liên tục thay vì bậc thang.
  if (A && rawA) {
    if (!isNew) { rawA.x += velA.x*dt; rawA.y += velA.y*dt; velA.x *= 0.90; velA.y *= 0.90; }
    A.x = fA.x(rawA.x, tSec); A.y = fA.y(rawA.y, tSec);
  }
  if (B && rawB) {
    if (!isNew) { rawB.x += velB.x*dt; rawB.y += velB.y*dt; velB.x *= 0.90; velB.y *= 0.90; }
    B.x = fB.x(rawB.x, tSec); B.y = fB.y(rawB.y, tSec);
  }
  const fresh = A && B && (tSec-seenA) < GRACE && (tSec-seenB) < GRACE;
  let gate = 0;
  if (fresh) {
    // chia cho fitDW (bề rộng camera thật hiển thị, sau cover-fit) chứ không phải W (bề rộng
    // MÀN HÌNH) -- xem giải thích đầy đủ ở detectPalmsTogether(), cùng 1 lý do: ngưỡng đo trên
    // video ref lúc camera=màn hình (fitDW=W), giữ đúng ý nghĩa gốc khi 2 cái lệch nhau (điện
    // thoại) bằng cách chia theo đúng cái camera THẬT chiếm bao nhiêu, không phải màn hình to
    // nhỏ ra sao.
    const d = Math.hypot(B.x-A.x, B.y-A.y) / Math.max(1,fitDW);
    if (d < 0.08) pairEverClose = true;   // xác nhận đã từng "chụm sát" -- xem giải thích ở khai báo
    if (pairEverClose) {
      const u = Math.max(0, Math.min(1, (d-0.10)/0.12));
      // chắp tay đưa 2 tay lại GẦN NHAU để kích hoạt immersion -- nếu chỉ dùng công thức
      // khoảng cách thô ở đây, dải sẽ tự co lại đúng lúc tay đang chụm cho chắp tay (2 hiệu
      // ứng đấu nhau). Sàn theo `immersion` (đo TRƯỚC lượt cập nhật immersion bên dưới, tức
      // 1 khung trễ -- không sao, cả 2 kênh cùng chạy ở framerate cao) giữ dải không co lại
      // trong lúc đang/đã chắp tay.
      gate = Math.max(u*u*(3-2*u), immersion); hadHands = true;
    }
  }
  if (!(alive >= 0)) alive = 0;
  alive += (gate-alive) * Math.min(1, dt*(gate>alive?14:8));
  if (alive > 0.8) wasFullyOpen = true;
  // chắp tay chỉ có nghĩa khi dải ĐÃ TỪNG mở đủ rộng (đúng ý Leon: "lúc đầu chỉ nằm trong
  // zone... chắp lại thì nguyên màn hình") -- dùng LATCH wasFullyOpen, không dùng alive tức
  // thời (xem giải thích ở khai báo wasFullyOpen: alive tự rơi đúng lúc tay xích lại gần để
  // chắp, gate theo alive tức thời sẽ tự khoá chặn trước khi kịp phát hiện).
  const chapTarget = wasFullyOpen ? detectPalmsTogether() : 0;
  if (!(immersion >= 0)) immersion = 0;
  immersion += (chapTarget-immersion) * Math.min(1, dt*(chapTarget>immersion?6:3));
  if (!fresh && hadHands && alive < 0.05) {
    worldIdx = (worldIdx+1) % WORLDS.length; applyWorld();
    hadHands = false; A = B = null; ambient = []; pairEverClose = false; immersion = 0; wasFullyOpen = false;
    rawA = rawB = null; velA = {x:0,y:0}; velB = {x:0,y:0};
    fA = { x:OneEuro(2.2,0.9,1.0), y:OneEuro(2.2,0.9,1.0) }; fB = { x:OneEuro(2.2,0.9,1.0), y:OneEuro(2.2,0.9,1.0) };
    resetPt(AthumbPt); resetPt(AindexPt); resetPt(BthumbPt); resetPt(BindexPt);
    AsizeVal = 45; BsizeVal = 45; membraneSway = 0;
  }
  for (const s of sparks){ s.life -= dt*1.8; s.x += s.vx*dt*60; s.y += s.vy*dt*60; }
  sparks = sparks.filter(s=>s.life>0);

  // hạt năng lượng lơ lửng bên trong dải khi mở — trôi chậm lên trên, đổi hướng nhẹ
  if (alive > 0.15 && A && B && ambient.length < 26 && Math.random() < 0.5) {
    const t = Math.random(), x = lerpA(A.x,B.x,t) + (Math.random()-0.5)*40*DPR;
    const y = Math.max(A.y,B.y) + Math.random()*60*DPR;
    ambient.push({ x, y, vx:(Math.random()-0.5)*0.25, vy:-(0.4+Math.random()*0.7),
                    life:1, decay:0.16+Math.random()*0.12, sway:Math.random()*6.283 });
  }
  for (const p of ambient){ p.life -= dt*p.decay; p.sway += dt*2;
    p.x += (p.vx + Math.sin(p.sway)*0.3) * dt*60; p.y += p.vy*dt*60; }
  ambient = ambient.filter(p=>p.life>0);

  updateChannels(dt);
  // "vải mềm": dao động sống ngay cả lúc đứng yên (biên độ nền nhỏ, không bao giờ phẳng lì —
  // cùng triết lý với turb ở shader), biên độ lớn hơn khi tay đang động thật.
  const swayTarget = Math.sin(tSec*1.7) * Math.min(1, CH.handSpeed*8 + 0.15);
  membraneSway = lerpA(membraneSway, swayTarget, Math.min(1, dt*4));
}

const radCache = {};
function radial(hex){
  if (radCache[hex]) return radCache[hex];
  const c = document.createElement('canvas'); c.width=c.height=128;
  const cc = c.getContext('2d');
  const g = cc.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,`rgba(${hex},1)`); g.addColorStop(0.4,`rgba(${hex},0.45)`); g.addColorStop(1,`rgba(${hex},0)`);
  cc.fillStyle=g; cc.fillRect(0,0,128,128);
  return radCache[hex]=c;
}

// ---- Mặt nạ năng lượng: vẽ lại mỗi khung từ chính 478 điểm landmark mặt ĐANG track, không
// dán ảnh/hoạ tiết rời nào -- nên không có khái niệm "lệch theo cử động" như bản Spider-Man
// cũ Leon từng chê ("xấu vcc, vì mày vẽ nó không khớp"). Chỉ số landmark (chuẩn công khai
// MediaPipe FaceMesh, dùng rộng rãi): 10=đỉnh trán, 152=cằm, 234/454=má trái/phải,
// 33/133=khoé mắt phải (ngoài/trong), 362/263=khoé mắt trái (trong/ngoài), 168=sống mũi
// giữa 2 mắt, 1=đầu mũi. CHƯA verify trên mặt thật (sandbox không có camera) -- nếu lệch
// nhẹ do sai chỉ số thì hình chỉ xê dịch vài px (các điểm lân cận trong mesh rất sát nhau),
// không vỡ hẳn; Leon test thật thấy tỉ lệ nào chưa ưng thì báo, sửa nhanh vì chỉ số + tỉ lệ
// đều gom hết trong hàm này.
function drawFaceMask(alphaMul){
  if (!faceLm || alphaMul <= 0.01) return;
  const w = WORLDS[worldIdx];
  let fwd = facePx(10), chin = facePx(152), cheekL = facePx(234), cheekR = facePx(454);
  const eyeROut = facePx(33), eyeRIn = facePx(133), eyeLIn = facePx(362), eyeLOut = facePx(263);
  const bridge = facePx(168), noseTip = facePx(1);
  if (!fwd || !chin || !cheekL || !cheekR || !eyeROut || !eyeRIn || !eyeLIn || !eyeLOut || !bridge || !noseTip) return;

  const faceW = Math.hypot(cheekR.x-cheekL.x, cheekR.y-cheekL.y);
  const faceH = Math.hypot(chin.x-fwd.x, chin.y-fwd.y);
  const glowCol = `rgba(${w.edge},1)`;
  // đo trên ảnh mặt thật (s00.png): dùng thẳng 234/454/10/152 làm 4 đỉnh khối viền thì lệch
  // ra ngoài tai/tóc — má người thật không lồi ra tới mép ngoài má (landmark 234/454) theo
  // hướng nhìn thẳng camera, kéo vào 18% so với tâm mặt (trung điểm sống mũi) cho khít hơn.
  const cx0 = bridge.x, cy0 = bridge.y;
  const pull = (p, k) => ({ x: p.x + (cx0-p.x)*k, y: p.y + (cy0-p.y)*k });
  cheekL = pull(cheekL, 0.38); cheekR = pull(cheekR, 0.38);
  fwd = pull(fwd, 0.16); chin = pull(chin, 0.14);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // dải "visor" ngang qua 2 mắt, cong nhẹ qua sống mũi
  ctx.beginPath();
  ctx.moveTo(eyeROut.x, eyeROut.y);
  ctx.quadraticCurveTo(bridge.x, bridge.y - faceH*0.02, eyeLOut.x, eyeLOut.y);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = faceW*0.09; ctx.strokeStyle = glowCol; ctx.globalAlpha = alphaMul*0.16; ctx.stroke();
  ctx.lineWidth = faceW*0.035; ctx.globalAlpha = alphaMul*0.5; ctx.stroke();
  ctx.lineWidth = faceW*0.012; ctx.globalAlpha = alphaMul*0.9; ctx.strokeStyle = 'rgba(255,252,255,1)'; ctx.stroke();

  // 2 khe mắt phát sáng, dọc theo trục khoé-trong -> khoé-ngoài mỗi bên
  for (const [outer, inner] of [[eyeROut,eyeRIn],[eyeLIn,eyeLOut]]){
    const cx=(outer.x+inner.x)/2, cy=(outer.y+inner.y)/2;
    const ang = Math.atan2(inner.y-outer.y, inner.x-outer.x);
    const len = Math.hypot(inner.x-outer.x, inner.y-outer.y)*1.15;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
    ctx.beginPath(); ctx.ellipse(0,0, len/2, faceW*0.045, 0, 0, 6.283);
    ctx.fillStyle = glowCol; ctx.globalAlpha = alphaMul*0.85; ctx.fill();
    ctx.restore();
  }

  // đường chỉ trung tâm trán -> sống mũi -> đầu mũi, kiểu đường giáp mặt nạ
  ctx.beginPath(); ctx.moveTo(fwd.x, fwd.y + faceH*0.06); ctx.lineTo(bridge.x, bridge.y); ctx.lineTo(noseTip.x, noseTip.y);
  ctx.lineWidth = faceW*0.02; ctx.strokeStyle = 'rgba(255,252,255,1)'; ctx.globalAlpha = alphaMul*0.7; ctx.stroke();

  // viền góc cạnh 2 bên má/hàm -- cho mặt nạ có khối, không chỉ mắt+mũi trơ trọi
  for (const [from,to] of [[fwd,cheekL],[cheekL,chin],[fwd,cheekR],[cheekR,chin]]){
    ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y);
    ctx.lineWidth = faceW*0.045; ctx.strokeStyle = glowCol; ctx.globalAlpha = alphaMul*0.14; ctx.stroke();
    ctx.lineWidth = faceW*0.01; ctx.globalAlpha = alphaMul*0.45; ctx.stroke();
  }

  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.restore();
}

const SLICES = 48;
// Leon: "khô cứng như 2D... cần khớp theo TỪNG NGÓN, chạy trong chiều không gian 3D" — dựng
// lại hình dải từ 4 điểm ngón THẬT (cái+trỏ mỗi tay, không gộp) + phối cảnh gần-to-xa-nhỏ theo
// độ lớn biểu kiến của tay (xem ghi chú ở mkPt) + "vải mềm" uốn nhẹ theo membraneSway, thay vì
// 1 trục A-B ± bề rộng đồng đều như trước. A/B (grip) vẫn giữ nguyên cho state machine mở/đóng.
const WIDTH_BOOST = 2.6;   // khoảng ngón cái-trỏ thật (~60-150px đo trên video ref) nhân lên
                            // cho gần cỡ dải cũ (maxH cũ ~130-210px) -- dải vẫn PHẢN ỨNG đúng
                            // theo khoảng ngón thật, chỉ là không vẽ đúng-bằng-pixel-vật-lý.
function drawRibbon(){
  if (alive < 0.02 || !A || !B) return;
  const w = WORLDS[worldIdx];
  const haveA = AthumbPt.pos && AindexPt.pos, haveB = BthumbPt.pos && BindexPt.pos;
  const midA = haveA ? { x:(AthumbPt.pos.x+AindexPt.pos.x)/2, y:(AthumbPt.pos.y+AindexPt.pos.y)/2 } : A;
  const midB = haveB ? { x:(BthumbPt.pos.x+BindexPt.pos.x)/2, y:(BthumbPt.pos.y+BindexPt.pos.y)/2 } : B;
  const dx=midB.x-midA.x, dy=midB.y-midA.y;
  const len = Math.max(Math.hypot(dx,dy), 60*DPR);
  const ang = Math.atan2(dy,dx);
  const clamp01 = v => Math.max(0, Math.min(1, v));
  // độ nhúm cái-trỏ THẬT của MỖI tay (không còn 1 hệ số trung bình áp chung 2 đầu như bản cũ)
  // -- mỗi đầu dải tự co/nở theo đúng tay đó, cộng biên an toàn min/max phòng nhiễu tracking.
  const rawWA = haveA ? Math.hypot(AthumbPt.pos.x-AindexPt.pos.x, AthumbPt.pos.y-AindexPt.pos.y) : null;
  const rawWB = haveB ? Math.hypot(BthumbPt.pos.x-BindexPt.pos.x, BthumbPt.pos.y-BindexPt.pos.y) : null;
  const oldMaxH = Math.min(Math.max(len*0.42, 90*DPR), H*0.42);   // dự phòng khi 4 điểm chưa kịp bind (vừa mở)
  const wA = Math.min(Math.max((rawWA ?? oldMaxH/1.3) * WIDTH_BOOST, 40*DPR), H*0.5);
  const wB = Math.min(Math.max((rawWB ?? oldMaxH/1.3) * WIDTH_BOOST, 40*DPR), H*0.5);
  // phối cảnh gần-to-xa-nhỏ: tay nào trông TO hơn (AsizeVal/BsizeVal, đo bằng px thật) là tay
  // gần camera hơn -- rõ nét hơn cả w lẫn glow ở đầu đó. Kẹp biên [0.6,1.7] để nhiễu tracking
  // không kéo méo quá đà (đo video ref: 2 tay cùng khung lệch nhau tới 110% so với TB).
  const avgSize = Math.max(1, (AsizeVal+BsizeVal)/2);
  const scaleA = Math.max(0.6, Math.min(1.7, AsizeVal/avgSize));
  const scaleB = Math.max(0.6, Math.min(1.7, BsizeVal/avgSize));
  const mx=(midA.x+midB.x)/2, my=(midA.y+midB.y)/2;
  const sw = len/SLICES;
  const top=[], bot=[], cs=[], halfW=[];
  for (let i=0;i<=SLICES;i++){
    const s = i/SLICES;
    const c = Math.cos(lerpA(rollA, rollB, s));
    const localScale = lerpA(scaleA, scaleB, s);
    const baseHalfW = lerpA(wA, wB, s)/2 * localScale;   // độ rộng thật (chưa vặn theo roll) -- dùng cho spark, không tụt về 0 ở điểm xoắn
    const hh = Math.abs(c) * baseHalfW;
    cs.push(c); halfW.push(baseHalfW);
    const x = -len/2 + i*sw;
    // "vải mềm": lệch vuông góc trục dài, mạnh nhất ở giữa (sin(s*PI)), tắt hẳn ở 2 đầu (neo
    // đúng ngón tay thật, không trôi khỏi vị trí ngón) -- membraneSway tự dao động sống.
    const bulge = Math.sin(s*Math.PI) * membraneSway * len * 0.05;
    top.push({x, y:-hh + bulge}); bot.push({x, y:hh + bulge});
  }
  // --- ô cửa: nội dung giữ nguyên hệ trục màn hình, dải chỉ xén ---
  ctx.save();
  ctx.translate(mx,my); ctx.rotate(ang);
  ctx.beginPath();
  for (let i=0;i<=SLICES;i++) i?ctx.lineTo(top[i].x,top[i].y):ctx.moveTo(top[0].x,top[0].y);
  for (let i=SLICES;i>=0;i--) ctx.lineTo(bot[i].x,bot[i].y);
  ctx.closePath(); ctx.clip();
  ctx.save(); ctx.rotate(-ang); ctx.translate(-mx,-my);
  ctx.globalAlpha = alive;
  // BUG THẬT audit bắt được: trước đây kéo dãn glc full W×H, khác hẳn kiểu "cover" nền/immersion
  // đang dùng — nội dung TRONG dải bị bóp méo khác nền NGOÀI dải trên mọi màn hình lệch tỉ lệ
  // camera. Giờ dùng đúng fitOX/fitOY/fitDW/fitDH (cùng công thức, cùng nguồn với updateFit()).
  ctx.drawImage(glc, fitOX, fitOY, fitDW, fitDH);
  // hạt năng lượng lơ lửng — vẽ NGAY TRONG vùng clip của dải, không tràn ra ngoài
  ctx.globalCompositeOperation = 'lighter';
  for (const p of ambient) {
    ctx.globalAlpha = Math.min(p.life, 1-p.life+0.4) * alive * 0.8;
    const r = 3.5*DPR*(0.5+p.life*0.5);
    ctx.drawImage(radial(w.spark), p.x-r, p.y-r, r*2, r*2);
  }
  ctx.globalCompositeOperation = 'source-over';
  // mặt nạ vẽ trong vùng clip của dải -- nhân thêm (1-immersion) vì lúc chắp tay/immersion
  // cao, bản mặt nạ full-screen ở frame() đã phủ chỗ này rồi, tránh cộng dồn 2 lớp chồng nhau
  drawFaceMask(alive * (1-immersion));
  ctx.restore();
  let i0=0;
  while (i0 < SLICES){
    let i1=i0; while (i1<SLICES && (cs[i1]<0)===(cs[i0]<0)) i1++;
    if (cs[i0]<0){
      // độ rộng giờ đổi dọc theo dải (phối cảnh + mỗi tay 1 độ nhúm riêng) -- lấy đúng biên
      // trên/dưới thật của ĐOẠN này thay vì 1 hằng số maxH chung như bản cũ.
      let yT=Infinity, yB=-Infinity;
      for (let k=i0;k<=i1;k++){ yT=Math.min(yT, top[k].y); yB=Math.max(yB, bot[k].y); }
      ctx.globalAlpha = alive*0.45; ctx.fillStyle='#000';
      ctx.fillRect(-len/2+i0*sw, yT, (i1-i0)*sw, yB-yT);
    }
    i0=i1;
  }
  ctx.globalAlpha=1; ctx.restore();
  // --- viền phát sáng ---
  ctx.save(); ctx.translate(mx,my); ctx.rotate(ang);
  ctx.globalCompositeOperation='lighter'; ctx.lineJoin='round'; ctx.lineCap='round';
  for (const [wd,al,col] of [[18*DPR,0.13,`rgba(${w.edge},1)`],[8*DPR,0.30,`rgba(${w.edge},1)`],
                             [3*DPR,0.62,`rgba(${w.edge},1)`],[1.5*DPR,0.95,'rgba(255,252,255,1)']]){
    ctx.globalAlpha = alive*al; ctx.lineWidth=wd; ctx.strokeStyle=col;
    for (const pts of [top,bot]){ ctx.beginPath();
      pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); }
  }
  for (let i=1;i<=SLICES;i++) if (cs[i-1]*cs[i] < 0){
    const gx=-len/2+i*sw, r=halfW[i]*0.44;   // dùng độ rộng THẬT tại đây, không tụt về 0 như hh (hh~0 đúng tại điểm xoắn)
    ctx.globalAlpha = alive*0.55; ctx.drawImage(radial(w.spark), gx-r, -r, r*2, r*2);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.restore();
  if (alive>0.5 && Math.random()<0.5) for (const e of [A,B]){
    const a=Math.random()*6.283, v=0.6+Math.random()*1.6;
    sparks.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1});
  }
}

// ===================== Lớp thế giới (GL) =====================
// ma trận: uv màn hình -> uv ảnh mặt nạ, dựng từ tư thế đầu THẬT
function drawQuad(){ gl.drawArrays(gl.TRIANGLES, 0, 3); }

// Pass BEAUTY: video thật -> fboBeauty (mịn da nhẹ, KHÔNG mirror — bộ lọc ảnh thuần,
// giữ nguyên hệ toạ độ để thay thế texCam ở bất kỳ đâu mà không phá logic mirror sẵn có).
function renderBeauty(){
  ensurePipeline(VW, VH);
  gl.bindVertexArray(vao);
  pushTex(0, texCam, video);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboBeauty.fb);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progBeauty);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texCam);
  gl.uniform2f(uBeauty.uPixel, 1/VW, 1/VH);
  drawQuad();
}

// NỀN LUÔN LUÔN là camera thường (đã beauty, mirror đúng) — bất kể dải đang mở hay đóng.
// Trước đây renderWorld() ghi đè thẳng lên chính canvas glc mà Canvas2D dùng làm nền toàn
// màn hình -> lúc dải mở, CẢ MÀN HÌNH biến thành thế giới khác chứ không riêng gì trong dải
// (Leon chỉ đúng: dải phải là Ô CỬA SỔ, chỉ không gian TRONG dải mới được biến đổi). Fix:
// mỗi khung LUÔN chạy renderBaseLayer() trước (blit camera thường vào glc), frame() vẽ NGAY
// nội dung glc (camera thường) lên màn hình LÀM NỀN trước khi renderWorld() (nếu chạy) ghi đè
// glc bằng thế giới khác — drawRibbon() vẫn vẽ từ `glc` bên trong vùng clip của dải sau đó.
// Audit bắt được 2 việc, vá cùng lúc:
// 1) Trước đây có canvas `glbg` riêng để "chụp" lại glc mỗi khung — 1 bản copy canvas-sang-
//    canvas toàn khung hình thừa, vì chỉ cần vẽ background TRƯỚC khi renderWorld() ghi đè là
//    đủ, khỏi cần "chụp" lại vào đâu cả. Bỏ hẳn `glbg`, frame() vẽ thẳng từ `glc`.
// 2) Camera chạy ~30fps nhưng rAF màn hình di động có thể ~60Hz -- trước đây MỌI khung rAF
//    đều tải lại texture camera + chạy lại shader BEAUTY dù ảnh camera CHƯA ĐỔI. Giờ nhận
//    tham số `fresh` (frame() đã có sẵn, tính đúng lúc camera thật sự có khung mới) — khung
//    không fresh thì glc GIỮ NGUYÊN nội dung khung trước (nhìn giống hệt vì camera chưa đổi).
function renderBaseLayer(fresh){
  if (!VW) return;
  if (glc.width !== VW || glc.height !== VH) { glc.width = VW; glc.height = VH; }
  // BUG THẬT Leon báo "màn hình chớp chớp chớp" lúc đang dùng dải -- CHỈ phần ĐẮT (upload
  // texture camera mới + chạy shader BEAUTY) mới được gate theo `fresh`. BLIT (rẻ, 1 quad
  // textured) PHẢI chạy MỌI khung kể cả khung không-fresh: renderWorld() (chạy mỗi khung khi
  // dải mở, KHÔNG gate theo fresh) ghi đè glc bằng thế giới khác ở CUỐI mỗi khung TRƯỚC ĐÓ --
  // nếu BLIT cũng bị gate theo fresh, khung không-fresh kế tiếp vẽ NỀN từ glc đang là "thế
  // giới khác" còn sót lại (chưa được blit-lại-thành-camera-thường), xen kẽ đúng-sai mỗi khung
  // theo nhịp fresh/không-fresh tự nhiên (camera ~30fps, màn hình rAF ~60Hz) -> nhấp nháy.
  if (fresh) renderBeauty();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progBlit); gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboBeauty.tex);
  drawQuad();
}

function renderWorld(){
  if (!VW) return;
  ensurePipeline(VW, VH);   // renderBaseLayer() đã chạy renderBeauty() khung này rồi, khỏi chạy lại
  gl.bindVertexArray(vao);

  // Pass 1 FRESH: người + nền của khung này (chưa vệt) — uCam giờ là fboBeauty (đã mịn da)
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboFresh.fb);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progFresh);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboBeauty.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, maskTex || blank1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texBg);
  const va = VW/VH, Z = 0.72;   // zoom nền để không lộ viền khung tranh
  gl.uniform2f(uFresh.uBgFit, (va > bgAspect ? 1 : bgAspect/va)*Z, (va > bgAspect ? va/bgAspect : 1)*Z);
  gl.uniform2f(uFresh.uPixel, 1/VW, 1/VH);
  gl.uniform3fv(uFresh.uTint, WORLDS[worldIdx].tint);
  gl.uniform1f(uFresh.uTime, tSec);
  gl.uniform1f(uFresh.uTurb, Math.min(2, CH.handSpeed * 22));   // kênh handSpeed -> độ nhiễu warp
  drawQuad();

  // Pass 2 COMBINE: feedback ping-pong — trail cũ + khung mới -> vệt ghi vào FBO còn lại
  const w = 1 - trailRead;
  gl.bindFramebuffer(gl.FRAMEBUFFER, trail[w].fb);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progCombine);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[trailRead].tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fboFresh.tex);
  gl.uniform1f(uCombine.uDecay, 0.90);
  gl.uniform2f(uCombine.uDrift, Math.sin(tSec*0.21)*0.0009, Math.cos(tSec*0.17)*0.0007);
  gl.uniform1f(uCombine.uZoom, 1.004);
  gl.uniform1f(uCombine.uKick, Math.min(1, CH.handAccel * 45));   // kênh handAccel -> kick vào trail
  drawQuad();
  trailRead = w;

  // Pass 3 BRIGHT (1/4 res): trích vùng sáng cho bloom
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomBright.fb);
  gl.viewport(0,0,bloomBright.w,bloomBright.h);
  gl.useProgram(progBright);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[trailRead].tex);
  drawQuad();

  // Pass 4/5 BLUR: Gaussian tách trục, ngang rồi dọc, vẫn ở 1/4 res
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomBlurA.fb);
  gl.viewport(0,0,bloomBlurA.w,bloomBlurA.h);
  gl.useProgram(progBlur);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomBright.tex);
  gl.uniform2f(uBlur.uTexel, 1/bloomBright.w, 1/bloomBright.h);
  gl.uniform2f(uBlur.uDir, 1, 0);
  drawQuad();

  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomBlurB.fb);
  gl.viewport(0,0,bloomBlurB.w,bloomBlurB.h);
  gl.useProgram(progBlur);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomBlurA.tex);
  gl.uniform2f(uBlur.uTexel, 1/bloomBlurA.w, 1/bloomBlurA.h);
  gl.uniform2f(uBlur.uDir, 0, 1);
  drawQuad();

  // Pass 6 PRESENT: hợp bloom + chromatic aberration + vignette + grain -> vẽ ra CHÍNH canvas glc
  if (glc.width !== VW || glc.height !== VH) { glc.width = VW; glc.height = VH; }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,VW,VH);
  gl.useProgram(progPresent);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trail[trailRead].tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomBlurB.tex);
  gl.uniform1f(uPresent.uTime, tSec);
  drawQuad();
}

// Đo lại bằng HandLandmarker SẠCH trên 60 khung liên tiếp của video ref: tỉ lệ bắt
// đủ 2 tay là 0.72-0.77 khi nạp thẳng video (960x720/576px), nhưng 0.82 khi thu nhỏ
// còn 320px. Độ phân giải KHÔNG ảnh hưởng tốc độ trên GPU (đúng như nghiên cứu nói)
// nhưng ẢNH HƯỞNG ĐỘ NHẬN DIỆN — hai chuyện khác nhau. Chỉ áp cho TAY (mặt/người
// không cần, không ai kêu hỏng).
const HAND_IN_W = 320;
const handCv = document.createElement('canvas'); const handCtx = handCv.getContext('2d');
function handInput(){
  if (!VW) return video;
  const w = HAND_IN_W, h = Math.max(1, Math.round(HAND_IN_W*VH/VW));
  if (handCv.width !== w || handCv.height !== h) { handCv.width = w; handCv.height = h; }
  handCtx.drawImage(video, 0, 0, w, h);
  return handCv;
}

// ===================== Vòng chạy =====================
let last = performance.now(), tsCounter = 0, faceFrameCounter = 0, modelErrStreak = 0, everLearnedGesture = false;
let hasNewFrame = true, lastVFC = 0;
const hasRVFC = !!video.requestVideoFrameCallback;
if (hasRVFC) {
  const tick = () => { hasNewFrame = true; lastVFC = performance.now();
                       video.requestVideoFrameCallback(tick); };
  video.requestVideoFrameCallback(tick);
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (!ready || video.readyState < 2) return;
  if (!VW) { VW = video.videoWidth; VH = video.videoHeight; updateFit(); }
  if (!VW) return;
  // chỉ chạy model khi có khung camera mới. Audit bắt được: bản cũ dùng `now - lastVFC > 400`
  // làm cả 2 việc (rVFC không hỗ trợ VÀ rVFC bị kẹt) — khi bị KẸT (rVFC từng chạy rồi đứng,
  // ví dụ tab bị nền/camera đứng hình), lastVFC không cập nhật nữa nên `now-lastVFC` cứ tăng
  // mãi > 400 ở MỌI khung rAF sau đó -> models chạy full-rate (~60Hz) trên đúng 1 khung hình
  // cũ lặp lại vô ích -- ngược hẳn ý định "đỡ tốn" của watchdog. Tách rõ 2 case: không hỗ trợ
  // (hasRVFC=false) thì luôn fresh như cũ; bị KẸT thì chỉ coi fresh 1 lần rồi tự "reset đồng hồ"
  // (lastVFC=now) để chờ đủ 400ms nữa mới thử lại, thay vì mọi khung.
  const stalled = hasRVFC && (now - lastVFC > 400);
  const fresh = hasNewFrame || !hasRVFC || stalled;
  hasNewFrame = false;
  if (stalled) lastVFC = now;

  const src = video;   // nạp thẳng từ video, không blit qua canvas
  // MediaPipe dùng chung một đồng hồ mốc thời gian cho mọi task trong cùng WASM module
  // (không phải mỗi task một đồng hồ riêng) -> mỗi lệnh gọi PHẢI lấy mốc mới, không
  // được dùng lại cùng một số cho hai task khác nhau trong cùng khung.
  if (fresh) try {
    readHands(hand.detectForVideo(handInput(), ++tsCounter));
    // seg/face giờ có thể còn null (initExtras() chạy nền không chờ, xem boot IIFE) -- gate
    // bằng seg&&/face&& thay vì để lỗi rơi vào catch rỗng, để không bị đếm nhầm thành lỗi thật.
    // tách người + mặt chỉ chạy khi dải đang mở/sắp mở — mặt nạ chỉ hiện được lúc đó nên
    // detect sớm hơn cũng vô ích. Face ~7,5ms/lần (đo hồi kiến trúc v2) — ăn phần lớn dư
    // địa khung hình còn lại, nhưng cả 3 model cộng dồn vẫn dưới ngân sách 33,3ms @30fps
    // TRÊN MÁY LEON — Leon báo lag trên điện thoại (máy yếu hơn). Mặt nạ là hiệu ứng trang
    // trí, không cần bám khít từng khung như tay/dải -- hạ nhịp chạy face model còn 1/2 (mỗi
    // khung fresh thứ 2), giữa các khung không chạy thì faceLm giữ nguyên vị trí cũ (đứng yên
    // 1 khung, không giật, vì mặt di chuyển chậm hơn nhiều so với 60fps).
    if (seg && (alive > 0.02 || hands.length >= 2)) {
      seg.segmentForVideo(src, ++tsCounter, r => {
        const mk = r.confidenceMasks && r.confidenceMasks[0];
        if (mk) maskTex = mk.getAsWebGLTexture();
      });
    }
    if (face) {
      if (alive > 0.02) {
        faceFrameCounter++;
        if (faceFrameCounter % 2 === 0) readFace(face.detectForVideo(src, ++tsCounter));
      } else { faceLm = null; faceFrameCounter = 0; }
    }
    modelErrStreak = 0;
  } catch(e){
    // Audit bắt được: catch rỗng biến lỗi model DAI DẲNG thành im lặng tuyệt đối — màn hình
    // đứng hình mà không có tín hiệu gì để biết vì sao. Đếm chuỗi lỗi liên tiếp, báo 1 lần lên
    // console (không lặp lại làm spam) + báo cho Leon thấy trên màn hình sau ~0,5s lỗi liên tục.
    modelErrStreak++;
    if (modelErrStreak === 1) console.error('lỗi model 1 khung (sẽ tự thử lại khung sau):', e);
    if (modelErrStreak === 30) say('Mô hình lỗi liên tục — thử tải lại trang');
  }

  updateRibbon(dt);
  // Audit bắt được: #msg (nơi DUY NHẤT app hiện chữ) chỉ dùng cho trạng thái nạp/lỗi lúc khởi
  // động rồi bị xoá trắng ("") — app KHÔNG BAO GIỜ dạy người dùng cách chơi (chụm 2 tay rồi kéo
  // ra). Dạy 1 lần cho tới khi dải TỪNG mở đủ rộng lần đầu (wasFullyOpen), sau đó im hẳn, không
  // nhắc lại mỗi lần đóng/mở lại (everLearnedGesture không reset theo dải, chỉ set 1 lần/phiên).
  if (!everLearnedGesture) {
    if (wasFullyOpen) { everLearnedGesture = true; say(''); }
    else say(!hands.length ? 'Giơ hai tay vào khung hình'
           : !pairEverClose ? 'Chụm hai bàn tay lại gần nhau'
           : 'Kéo hai tay ra xa nhau');
  }
  // NỀN luôn chạy trước (camera thường, blit vào glc) — vẽ NỀN màn hình NGAY từ glc ở đây,
  // TRƯỚC KHI renderWorld() (nếu chạy) ghi đè glc bằng thế giới khác (không còn glbg riêng để
  // "chụp" giữ chỗ nữa — xem ghi chú ở renderBaseLayer()); drawRibbon() vẽ lại từ glc SAU khi
  // renderWorld() đã chạy, nên tự nhiên thấy đúng thế giới khác trong vùng clip của nó.
  renderBaseLayer(fresh);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(glc, fitOX, fitOY, fitDW, fitDH);
  if (alive > 0.02) renderWorld();
  // "Chắp tay" (👐 úp lòng bàn tay vào nhau) -> nhấn chìm TOÀN MÀN HÌNH: hoà dần glc (đang
  // là thế giới khác, vì immersion chỉ >0 khi alive đã >0.3 -- xem updateRibbon) đè lên nền
  // camera thường theo đúng tỉ lệ immersion. Gỡ tay ra thì immersion tự rơi về 0, tan dần
  // về lại camera thường + chỉ còn dải làm cửa sổ như cũ, không cần code riêng cho "gỡ ra".
  if (immersion > 0.01) {
    ctx.globalAlpha = immersion;
    ctx.drawImage(glc, fitOX, fitOY, fitDW, fitDH);
    ctx.globalAlpha = 1;
    drawFaceMask(immersion);
  }

  drawRibbon();
  // drawDebugDots();  // đã gỡ theo yêu cầu Leon — bật lại khi cần soi tracking

  const w = WORLDS[worldIdx];
  ctx.globalCompositeOperation='lighter';
  for (const sp of sparks){ ctx.globalAlpha = sp.life*alive; const r = 7*DPR*sp.life;
    ctx.drawImage(radial(w.spark), sp.x-r, sp.y-r, r*2, r*2); }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

// ===================== Khởi động =====================
(async () => {
  try {
    say('đang xin quyền camera…');
    // Audit bắt được 2 việc, vá cùng lúc:
    // 1) Trước đây chờ tải HẾT 3 model (~14,4MB) rồi MỚI xin quyền camera -- trên 4G có thể
    //    10-24s trước khi nút "Cho phép" kịp hiện ra. Giờ xin quyền + tải model TAY (model DUY
    //    NHẤT bắt buộc phải có trước khi dải hoạt động được) chạy SONG SONG bằng Promise.all,
    //    không nối đuôi nhau -- prompt xin quyền hiện gần như ngay lập tức.
    // 2) Constraint camera trước giờ CỨNG 16:9 ngang bất kể máy đang cầm dọc hay ngang --
    //    giờ hỏi thẳng hướng màn hình thật qua matchMedia, xin đúng chiều camera cần.
    const wantPortrait = matchMedia('(orientation: portrait)').matches;
    const [stream] = await Promise.all([
      navigator.mediaDevices.getUserMedia({
        video: wantPortrait
          ? { width:{ideal:720}, height:{ideal:1280}, aspectRatio:{ideal:9/16}, facingMode:'user' }
          : { width:{ideal:1280}, height:{ideal:720}, aspectRatio:{ideal:16/9}, facingMode:'user' },
        audio: false }),
      initHand(),
    ]);
    video.srcObject = stream;
    // Audit bắt được: MediaStream không bao giờ được dừng — rời trang/đóng tab mà không tự
    // stop() các track thì đèn camera/chỉ báo quyền riêng tư có thể còn sáng tới khi tab bị
    // đóng hẳn, tốn pin vô ích trên điện thoại. `persisted` = true nghĩa là trang được bfcache
    // giữ lại (có thể quay lại), lúc đó KHÔNG được tắt camera vì sẽ không tự bật lại được.
    addEventListener('pagehide', e => { if (!e.persisted) stream.getTracks().forEach(t => t.stop()); });
    await video.play();
    VW = video.videoWidth; VH = video.videoHeight; updateFit();
    applyWorld();   // giờ mới biết tỉ lệ camera THẬT -- load đúng bản ảnh dọc/ngang (pickBgPath).
                     // Trước đây có 1 lần gọi applyWorld() TRƯỚC camera (VW=0, đoán mù theo cửa
                     // sổ) -- bỏ hẳn, đỡ tải + giải mã + đẩy GPU 1 ảnh nền chỉ để vứt đi ngay.
    ready = true;
    say('');
    requestAnimationFrame(frame);
    initExtras();   // tách người + mặt -- chạy NỀN không chờ (xem ghi chú ở khai báo initHand())
  } catch(e) {
    say('Lỗi: ' + (e && e.message ? e.message : e));
    console.error(e);
  }
})();
addEventListener('click', () => { worldIdx = (worldIdx+1) % WORLDS.length; applyWorld(); });
</script>
